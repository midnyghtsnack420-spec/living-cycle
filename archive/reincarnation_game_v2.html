<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
#sf{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#root{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;background:rgba(8,8,20,0.88);color:#e2e8f0;border-radius:16px}
.fade{animation:fi .4s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 6px rgba(129,140,248,.3)}50%{box-shadow:0 0 16px rgba(129,140,248,.5)}}
.pw{animation:glow 2.5s ease infinite}
.card{background:rgba(255,255,255,0.06);color:#e2e8f0;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.card:hover{border-color:#818cf8;box-shadow:0 0 12px rgba(129,140,248,.15);transform:translateY(-1px)}
.card.sel{background:rgba(129,140,248,.2);border-color:#818cf8}
.card-desc{font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px;line-height:1.5}
.btn{width:100%;padding:12px 14px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#e2e8f0}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-p{background:#818cf8;color:#fff}.btn-p:hover{opacity:.9}
.btn-s{background:rgba(255,255,255,0.1)}.btn-s:hover{opacity:.85}
.muted{color:rgba(255,255,255,0.5)}
.accent{color:#a5b4fc}
.warn{color:#f87171}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600}
.badge-p{color:#a5b4fc;background:rgba(129,140,248,.15)}
.badge-n{color:#f87171;background:rgba(248,113,113,.1)}
.badge-m{color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.08)}
.chip{padding:5px 11px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#e2e8f0;font-size:12px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#818cf8}.chip.sel{background:#818cf8;color:#fff;border-color:#818cf8}
.title{font-size:24px;font-weight:800;text-align:center;letter-spacing:-0.03em;color:#e2e8f0}
.subtitle{font-size:13px;text-align:center;color:rgba(255,255,255,0.5);line-height:1.5}
.slabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.4);margin:14px 0 6px}
.input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#e2e8f0;font-size:14px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width .5s ease}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:6px 0}
.scell{text-align:center;padding:3px 1px;border-radius:4px;background:rgba(255,255,255,0.06)}
.scell .a{font-size:8px;font-weight:700;color:rgba(255,255,255,0.4)}
.scell .v{font-size:13px;font-weight:bold;color:#e2e8f0}
.scell.hi{background:rgba(129,140,248,.2)}.scell.hi .v{color:#a5b4fc}
.choice{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#e2e8f0;cursor:pointer;transition:all .2s;margin-bottom:8px}
.choice:hover{border-color:#818cf8;transform:translateY(-1px)}
.outcome{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);border-radius:10px;padding:14px;margin:10px 0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}

{t:'Leave it alone — some things aren\'t meant for you',o:'You walk away. The discovery lingers in your dreams — what could have been. But you sleep well, and your conscience is clear.',e:{harmony:2,instinct:1,intellect:-1},y:1,a:['survival','spiritual'],b:['intellectual','creative']},
]},
{id:'crisis',s:'childhood',t:'The Family Crisis',x:'Disaster strikes {h}. The {ch} that has been threatening everyone finally reaches your doorstep. Your family looks to you — even though you are young.',c:[
{t:'Take charge — you will fix this',o:'You step forward when others step back. The burden is heavy for your age, but you carry it. When the crisis passes, you are no longer a child in their eyes.',e:{power:2,resilience:2,compassion:1,vitality:-1},y:1,a:['material','survival','social'],b:['spiritual']},
{t:'Support quietly from behind',o:'You do the unseen work that holds things together. No one thanks you, but the family survives because of what you did when no one was watching.',e:{compassion:2,resilience:1,harmony:1,charisma:-1},y:1,a:['social','spiritual'],b:['material']},
{t:'Run — you can\'t face this yet',o:'You flee into the night, guilt burning in your chest. You survive, but the shame follows you. Some nights you still hear them calling.',e:{instinct:2,resilience:-1,compassion:-2,harmony:-1},y:1,a:['survival'],b:['social','material']},
]},
{id:'trial',s:'adolescence',t:'The First Trial',x:'The community demands you prove yourself — a trial by {w}, a test of knowledge, a challenge of spirit. Pass and you are recognized. Fail and you remain a child in their eyes.',c:[
{t:'Face it head-on with raw courage',o:'You throw yourself into the trial with everything. It is brutal, but you will not yield. When it ends, you stand — barely, but you stand.',e:{power:2,resilience:2,vitality:-2,instinct:1},y:2,a:['material','survival'],b:['intellectual']},
{t:'Prepare meticulously — outsmart it',o:'You study, train, plan. When the trial comes, you are ready. You pass with elegance, not force. Some say you cheated. You know you didn\'t.',e:{intellect:2,wisdom:1,power:1,charisma:-1},y:2,a:['intellectual','creative'],b:['material']},
{t:'Refuse the trial — define yourself',o:'You stand before the community and refuse. "I will not prove myself to you." The silence is deafening. But you know who you are.',e:{consciousness:3,instinct:2,power:-2,charisma:-1,harmony:1},y:2,a:['spiritual','creative'],b:['material','social']},
]},
{id:'forbidden',s:'adolescence',t:'The Forbidden Path',x:'You discover something forbidden — a banned {sc}, a sealed door in the {te}, a technique the {l} has outlawed. It calls with the whisper of hidden power.',c:[
{t:'Pursue it in secret',o:'You study the forbidden in stolen moments. It changes you. Power flows through you that others fear to name. But the secret sits heavy in your chest.',e:{power:3,consciousness:2,compassion:-2,harmony:-2},y:2,a:['material','intellectual','creative'],b:['social','spiritual']},
{t:'Report it to the {m}',o:'You bring the forbidden thing to your {m}. They teach you why it was forbidden, and the lesson is worth more than the forbidden thing itself.',e:{wisdom:2,charisma:1,compassion:1,power:-1,harmony:1},y:1,a:['social','spiritual'],b:['material']},
{t:'Destroy it — some knowledge is poison',o:'You burn the {sc}, seal the door. The forbidden thing screams as it dies. You sleep peacefully. The world is safer, and so are you.',e:{harmony:2,compassion:2,instinct:1,intellect:-1,power:-1},y:1,a:['spiritual','social','survival'],b:['intellectual']},
]},
{id:'bond',s:'adolescence',t:'The First Bond',x:'You meet someone who sees you — truly sees you. Not the role you play, but the person underneath. The connection is immediate and overwhelming.',c:[
{t:'Open yourself fully — love without walls',o:'You let them in completely. The vulnerability is terrifying, then liberating. They know your fears, your dreams, your shame. And they stay.',e:{compassion:3,harmony:2,charisma:1,instinct:1},y:2,a:['social','spiritual'],b:['material','survival']},
{t:'Hold back — protect yourself',o:'You keep part hidden. The bond forms with a wall between you. It is safe. It is also lonely.',e:{resilience:2,wisdom:1,compassion:-1,harmony:-1},y:2,a:['survival','intellectual'],b:['social']},
{t:'Let them go — not the right time',o:'You walk away. The timing is wrong. You carry the memory of what could have been like a stone in your pocket.',e:{wisdom:2,resilience:1,instinct:2,compassion:-2,harmony:-1},y:1,a:['intellectual','survival'],b:['social']},
]},
{id:'calling',s:'young_adult',t:'The Calling',x:'A calling finds you — a role, a mission, a purpose that demands your attention. It is everything you wanted, but it will cost the comfortable life you\'ve built.',c:[
{t:'Answer fully — sacrifice everything',o:'You abandon comfort, routine, safety. The work is harder than anything you\'ve done, but it feels like what you were made for.',e:{power:2,consciousness:2,creativity:2,vitality:-2,wealth:-2},y:3,a:['spiritual','intellectual','creative'],b:['material','survival']},
{t:'Answer partially — keep one foot in safety',o:'You pursue the calling but maintain your safety net. Progress is slower, but the fall would be softer.',e:{wisdom:1,power:1,creativity:1,wealth:1,harmony:1},y:2,a:['intellectual','survival','material'],b:['spiritual']},
{t:'Refuse — your path is elsewhere',o:'You turn away from the calling. Years later, you still wonder. But the path you chose has its own rewards.',e:{instinct:2,resilience:2,wisdom:1,consciousness:-1},y:2,a:['survival','material'],b:['spiritual','creative']},
]},
{id:'wandering',s:'young_adult',t:'The Wandering Call',x:'The horizon pulls at you. A {j} presents itself — far from {t}, beyond everything you know. The maps run out where your destination begins.',c:[
{t:'Go — wander into the unknown',o:'You leave with nothing but what you carry. The {j} reshapes you in ways you cannot predict. You become someone you wouldn\'t recognize.',e:{consciousness:2,instinct:2,resilience:2,creativity:1,wealth:-2,compassion:1},y:3,a:['spiritual','creative','survival'],b:['material']},
{t:'Go but plan it meticulously',o:'You prepare for months. The {j} is safer, but you miss what makes it transformative — the chaos, the uncertainty, the growth from being truly lost.',e:{intellect:2,wisdom:2,resilience:1,wealth:-1,instinct:-1},y:3,a:['intellectual','survival'],b:['spiritual']},
{t:'Stay — build something here instead',o:'You watch others leave and feel the pull, but you stay. You build, deepen roots, create something where you are.',e:{wealth:2,power:1,resilience:1,harmony:1,consciousness:-1},y:2,a:['material','social'],b:['spiritual','creative']},
]},
{id:'rival',s:'young_adult',t:'The Rival',x:'Someone emerges who matches you — in talent, in ambition, in raw potential. The competition between you is electric.',c:[
{t:'Outcompete them ruthlessly',o:'You throw everything into beating them. You win — barely — and the victory tastes like ash. You remain, wondering if winning was worth the cost.',e:{power:3,intellect:2,charisma:1,compassion:-3,harmony:-2},y:2,a:['material'],b:['social','spiritual']},
{t:'Join forces — combine strengths',o:'You approach them as an equal. Together, you are more than either alone. The work you create together defines both your legacies.',e:{creativity:2,charisma:2,intellect:2,power:1,compassion:1},y:2,a:['creative','intellectual','social'],b:['material']},
{t:'Let them win — learn from their victory',o:'You step back and watch them succeed. You study their methods. When the time is right, you apply what you learned.',e:{wisdom:3,intellect:1,instinct:1,power:-1,resilience:1},y:2,a:['intellectual','spiritual'],b:['material']},
]},
{id:'glimpse',s:'adult',t:'The Spiritual Glimpse',x:'In a moment of stillness, the veil parts. You see beyond — the pattern, the connectedness, the vast cosmic architecture. It lasts seconds, but changes everything.',c:[
{t:'Chase the vision relentlessly',o:'You dedicate yourself to recapturing the glimpse. Your body weakens but your consciousness expands. You catch fragments, echoes.',e:{consciousness:4,wisdom:2,instinct:1,vitality:-3,harmony:1},y:3,a:['spiritual'],b:['material','survival']},
{t:'Integrate it — let it inform daily life',o:'You don\'t chase the vision. You let it settle into you, become part of how you see the world. It makes you more present, more grateful.',e:{consciousness:2,harmony:3,compassion:2,wisdom:1},y:2,a:['spiritual','social'],b:[]},
{t:'Share it — help others see',o:'You speak of what you saw. Some listen. Some think you\'ve lost your mind. The ones who understand become your closest circle.',e:{consciousness:1,charisma:2,compassion:2,wisdom:1,harmony:-1},y:2,a:['social','spiritual'],b:['material']},
]},
{id:'temptation',s:'adult',t:'The Temptation',x:'An opportunity appears — power, wealth, recognition. The path is clear. The cost is someone else\'s suffering. Not anyone you know. Just... someone.',c:[
{t:'Take it — the cost is not yours to bear',o:'You take what you want. The gain is real, immediate. At night, you think about the stranger who paid for your success.',e:{power:3,wealth:3,compassion:-4,harmony:-3},y:1,a:['material'],b:['social','spiritual']},
{t:'Refuse — some prices are too high',o:'You walk away. You will never know what it would have felt like. But you sleep well, and when you look in the mirror, you recognize yourself.',e:{compassion:3,harmony:3,wisdom:2,power:-1},y:1,a:['spiritual','social'],b:['material']},
{t:'Find a third way — get it without the cost',o:'You spend months finding an alternative. It\'s harder, slower, less certain. But you find a way that doesn\'t require anyone\'s suffering.',e:{creativity:3,intellect:2,wisdom:2,power:2,wealth:1},y:2,a:['intellectual','creative','material'],b:['survival']},
]},
{id:'sickness',s:'adult',t:'The Sickness',x:'Your body fails you. The sickness comes without warning and settles in. Healers gather, remedies are tried, but the outcome is uncertain.',c:[
{t:'Fight — rage against the dying',o:'You fight with everything. Every resource, every healer. The sickness breaks, but it takes years from you. You survive changed — harder, more fragile, more alive.',e:{resilience:3,vitality:1,harmony:-1,instinct:1},y:-5,a:['survival','material'],b:['spiritual']},
{t:'Accept — make peace with what comes',o:'You stop fighting and start accepting. The fear evaporates. In your weakness, you find a strength you didn\'t know existed — the strength to face the end with grace.',e:{harmony:3,consciousness:2,compassion:1,vitality:-2},y:-3,a:['spiritual'],b:['survival','material']},
{t:'Seek a cure — unconventional and dangerous',o:'You search for a cure others call impossible. The path takes you to strange places, strange remedies. It might work. It might kill you faster.',e:{intellect:2,instinct:2,creativity:1,vitality:-3,resilience:1},y:-3,a:['intellectual','creative'],b:['social']},
]},
{id:'war_s',s:'adult',t:'The War',x:'War comes to {t}. The {l} calls all who can fight. Your {w} waits for you. The enemy approaches, and there is no neutral ground.',c:[
{t:'Fight — defend your people',o:'You take up the {w}. Combat is nothing like you imagined — louder, bloodier, more intimate. You survive. Others don\'t. The memory never leaves.',e:{power:2,resilience:2,compassion:-1,vitality:-3,instinct:2},y:-4,a:['material','survival'],b:['spiritual']},
{t:'Mediate — seek peaceful resolution',o:'You walk between the lines, speaking to both sides. It\'s the most dangerous thing you\'ve ever done. But you find common ground. Fewer people die because of what you risked.',e:{charisma:3,wisdom:2,compassion:2,instinct:1,vitality:-1},y:1,a:['social','spiritual'],b:['material']},
{t:'Flee — take your loved ones and run',o:'You gather those you love and run. The shame is real, but they are alive. You rebuild elsewhere. The war eventually ends. You never go back.',e:{instinct:2,resilience:1,compassion:1,power:-2,harmony:-1,wealth:-2},y:-1,a:['survival'],b:['material','social']},
]},
{id:'great_work',s:'adult',t:'The Great Work',x:'An idea takes hold — something you must create, build, bring into being. It will take years, demand everything. But if you complete it, it will change the world.',c:[
{t:'Commit fully — sacrifice everything',o:'You pour yourself into the work. Relationships strain, health suffers. But the work grows, becomes real. When done, you are empty and magnificent.',e:{creativity:4,intellect:3,power:2,vitality:-3,wealth:-3,compassion:-1},y:4,a:['creative','intellectual'],b:['survival','social','material']},
{t:'Balance the work with life',o:'You pursue the work but maintain relationships, health, sanity. Progress is slower, but you remain whole. The work takes longer but doesn\'t consume you.',e:{creativity:2,intellect:2,harmony:2,compassion:1,wealth:-1},y:3,a:['intellectual','social','spiritual'],b:['material']},
{t:'Abandon it — the cost is too high',o:'You walk away. The idea lingers, knocking at night. Years later, someone else creates something similar. You watch from a distance and wonder.',e:{harmony:2,resilience:2,compassion:1,creativity:-1,wealth:1},y:2,a:['survival','social','material'],b:['creative','intellectual']},
]},
{id:'betrayal',s:'adult',t:'The Betrayal',x:'Someone you trusted — deeply, completely — betrays you. The wound is existential. Everything you believed about loyalty, about love, is called into question.',c:[
{t:'Forgive — release the debt',o:'You choose to let go. Not because they deserve it, but because you deserve peace. The forgiveness costs you nothing and everything. You are lighter and emptier.',e:{harmony:3,compassion:3,wisdom:2,power:-1,instinct:1},y:2,a:['spiritual','social'],b:['material']},
{t:'Seek revenge — make them pay',o:'You dedicate yourself to retribution. When it\'s done, the satisfaction is real but brief. Then the emptiness returns, deeper than before.',e:{power:3,intellect:2,compassion:-3,harmony:-3,charisma:-1},y:2,a:['material'],b:['social','spiritual']},
{t:'Cut them out — move on without closure',o:'You don\'t forgive or punish. You simply remove them from your life. Clean, decisive. You move on. The scar remains but it doesn\'t control you.',e:{resilience:3,instinct:2,wisdom:1,compassion:-1,harmony:1},y:1,a:['survival','intellectual'],b:['social']},
]},
{id:'loss',s:'adult',t:'The Loss',x:'You lose someone irreplaceable — to time, to fate, to the merciless arithmetic of mortality. The grief is a physical weight. The world continues as if nothing happened.',c:[
{t:'Dive into the grief — feel it all',o:'You don\'t run. You sit in it, drown in it. It takes months. But when you emerge, you understand something about love that only loss can teach.',e:{consciousness:3,compassion:3,wisdom:2,harmony:1,vitality:-2},y:2,a:['spiritual','social'],b:['material','survival']},
{t:'Honor them through action',o:'You channel the grief into something — a foundation, a work of art, a promise kept. The loss transforms into purpose. You carry them forward.',e:{creativity:2,power:2,compassion:2,wisdom:1,wealth:-1},y:2,a:['creative','intellectual','social'],b:['survival']},
{t:'Numb it — move on as fast as possible',o:'You bury the grief under activity and noise. It works, for a while. But grief is patient. Years later, it finds you in a quiet moment and demands its due.',e:{resilience:2,instinct:1,compassion:-2,harmony:-2,wealth:1},y:1,a:['survival','material'],b:['spiritual','social']},
]},
{id:'legacy_q',s:'elder',t:'The Legacy Question',x:'You are old now. The end approaches not as a threat but as a fact. People ask what you leave behind. What will outlast you?',c:[
{t:'Dedicate remaining time to teaching',o:'You gather students and pour everything into them. The knowledge outlives you, carried in their minds. This is your immortality.',e:{wisdom:3,compassion:2,charisma:2,intellect:1,vitality:-1},y:3,a:['intellectual','social','spiritual'],b:['material']},
{t:'Build something permanent',o:'You spend your final energy creating something that will stand — a building, an institution. Something physical that will outlast you by centuries.',e:{power:2,creativity:2,wealth:-2,resilience:1,harmony:1},y:2,a:['material','creative'],b:['social']},
{t:'Simply live — let legacy take care of itself',o:'You spend remaining days doing what you love with who you love. No grand project. Just days, well-lived, until there are no more.',e:{harmony:4,compassion:3,vitality:1,instinct:1,wisdom:1},y:3,a:['spiritual','social'],b:['material','intellectual']},
]},
{id:'reckoning',s:'elder',t:'The Reckoning',x:'In the quiet of your later years, the past visits. Choices you made, paths you didn\'t take, people you hurt. They sit with you and demand to be seen.',c:[
{t:'Face them — account for everything',o:'You sit with every choice, every failure, every moment of cowardice and courage. You hurt yourself with honesty. But when done, you are clean.',e:{consciousness:3,wisdom:3,harmony:3,compassion:2},y:2,a:['spiritual','intellectual'],b:['material']},
{t:'Make amends — reach out to those you wronged',o:'You track down the people you hurt and apologize. Some forgive. Some don\'t. Some are dead. But you try, and the trying is the point.',e:{compassion:3,charisma:2,harmony:2,wisdom:1,instinct:1},y:2,a:['social','spiritual'],b:['survival']},
{t:'Let the past be past',o:'You decline the reckoning. What\'s done is done. You focus on the present, the remaining light, the warmth still left.',e:{resilience:2,harmony:2,instinct:2,wisdom:-1},y:1,a:['survival'],b:['intellectual']},
]},
{id:'final',s:'elder',t:'The Final Choice',x:'The end is here. You feel it in your bones, in the fading light. One last choice remains: how will you meet it?',c:[
{t:'Face death with peace and gratitude',o:'You close your eyes and feel gratitude — for every moment, every joy, every pain that taught you. The light fades gently. You let it go.',e:{harmony:4,consciousness:3,compassion:2,wisdom:2},y:0,a:['spiritual','social'],b:['material']},
{t:'Rage — fight the end with everything',o:'You refuse to go quietly. You fight, claw, burn with the will to live. The end comes anyway, but it has to work for it. You leave like a fire.',e:{power:3,resilience:3,vitality:-1,harmony:-2,instinct:2},y:-1,a:['material','survival'],b:['spiritual']},
{t:'Transcend — become one with the pattern',o:'In the final moments, you see it all — the cycle, the pattern. You don\'t fight. You don\'t surrender. You expand. You become part of something infinite.',e:{consciousness:5,harmony:4,wisdom:3,instinct:2},y:0,a:['spiritual','intellectual','creative'],b:['material']},
]},
];
// STATE
let S={screen:'gate',lives:0,ev:{},pp:0,life:null,past:[],cs:{goal:null,being:null,life:null,era:null,reg:null,fam:null,ch:null,name:'',ava:{body:null,head:null,eyes:null,markings:null,attire:null,distinguishing:null},mod:null}};
STATS.forEach(s=>S.ev[s.id]=0);
// HELPERS
function fill(s,c){return s.replace(/\{(\w+)\}/g,(m,k)=>c[k]!==undefined?c[k]:m)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function tEvo(){return Object.values(S.ev).reduce((a,b)=>a+b,0)}
function eLvl(s){return S.ev[s]||0}
function ctx(){const f=FL[S.cs.era]||FL.ancient;return{age:S.life?S.life.age:0,m:f.m,t:f.t,j:f.j,w:f.w,te:f.te,sc:f.sc,sp:f.sp,l:f.l,h:f.h,ch:CHALLENGES.find(c=>c.id==S.cs.ch)?.n||'hardship'}}
function R(h){document.getElementById('root').innerHTML='<div class="fade">'+h+'</div>'}
function statN(id){return STATS.find(s=>s.id==id)}
// SCREENS
function showGate(){const e=tEvo();R(`<div style="text-align:center;padding-top:40px"><div class="title">Living Cycle</div><p class="subtitle" style="margin-top:8px">${e>0?'You have lived '+S.lives+' lifetimes. Evolution: '+e+'.':'You stand at the threshold. The cycle of rebirth stretches before you — infinite possibilities, infinite lives.'}</p>${e>0?`<div class="sgrid" style="max-width:320px;margin:16px auto">${STATS.map(s=>`<div class="scell"><div class="a">${s.a}</div><div class="v">${S.ev[s.id]}</div></div>`).join('')}</div>`:''}</div><div style="margin-top:32px"><button class="btn btn-p" onclick="startCr()">Enter the Cycle</button><button class="btn btn-s" style="margin-top:8px" onclick="R('<div style=text-align:center;padding-top:60px><p style=font-size:18px;color:#e2e8f0>The cycle continues without you.</p><p class=muted style=margin-top:8px>Perhaps another time. The door never closes.</p><button class=btn btn-p style=max-width:200px;margin:24px auto 0 onclick=showGate()>Return</button></div>')">Decline</button>${e>=15?'<button class="btn" style="background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.4);color:#c084fc;margin-top:8px" onclick="showAscend()">\u2726 Ascend Beyond the Cycle \u2726</button>':''}</div>`)}
function startCr(){S.cs={goal:null,being:null,life:null,era:null,reg:null,fam:null,ch:null,name:'',ava:{body:null,head:null,eyes:null,markings:null,attire:null,distinguishing:null},mod:null};showGoal()}
function showGoal(){R(`<div style="padding-top:16px"><div class="title" style="font-size:18px">Choose Your Life's Goal</div><p class="subtitle" style="margin-bottom:16px">This purpose will guide — or haunt — your entire life</p>${GOALS.map(g=>`<div class="card${S.cs.goal==g.id?' sel':''}" onclick="S.cs.goal='${g.id}';showGoal()"><div style="font-weight:600;font-size:14px">${g.n}</div><div class="card-desc">${g.d}</div></div>`).join('')}<button class="btn btn-p" style="margin-top:12px" ${S.cs.goal?'':'disabled'} onclick="showBeing()">Continue</button></div>`)}
function showBeing(){const e=tEvo();R(`<div style="padding-top:16px"><div class="title" style="font-size:18px">Choose Your Being</div><p class="subtitle" style="margin-bottom:16px">What form will your consciousness take?</p>${BEINGS.map(b=>{const lk=b.req&&e<b.req;return`<div class="card${S.cs.being==b.id?' sel':''}" ${lk?'style=opacity:.35':''} ${lk?'':`onclick="S.cs.being='${b.id}';showBeing()"`}><div style="display:flex;justify-content:space-between"><span style="font-weight:600;font-size:14px">${b.n}</span>${lk?`<span class="muted" style="font-size:10px">Evo ${b.req}+</span>`:''}</div><div class="card-desc">${b.d}</div>${Object.keys(b.m).length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${Object.entries(b.m).map(([k,v])=>`<span class="badge ${v>0?'badge-p':'badge-n'}">${v>0?'+':''}${v} ${statN(k).a}</span>`).join('')}</div>`:''}</div>`}).join('')}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-s" style="max-width:80px" onclick="showGoal()">Back</button><button class="btn btn-p" style="flex:1" ${S.cs.being?'':'disabled'} onclick="showLife()">Continue</button></div></div>`)}
function showLife(){const e=tEvo();R(`<div style="padding-top:16px"><div class="title" style="font-size:18px">Choose Your Path</div><p class="subtitle" style="margin-bottom:16px">What discipline will define your approach to life?</p>${LIFESTYLES.map(l=>{const lk=l.req&&e<l.req;return`<div class="card${S.cs.life==l.id?' sel':''}" ${lk?'style=opacity:.35':''} ${lk?'':`onclick="S.cs.life='${l.id}';showLife()"`}><div style="display:flex;justify-content:space-between"><span style="font-weight:600;font-size:14px">${l.n}</span>${lk?`<span class="muted" style="font-size:10px">Evo ${l.req}+</span>`:''}</div><div class="card-desc">${l.d}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${Object.entries(l.m).map(([k,v])=>`<span class="badge badge-p">+${v} ${statN(k).a}</span>`).join('')}</div></div>`}).join('')}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-s" style="max-width:80px" onclick="showBeing()">Back</button><button class="btn btn-p" style="flex:1" ${S.cs.life?'':'disabled'} onclick="showWorld()">Continue</button></div></div>`)}

// GAME
function startLife(){const st={};STATS.forEach(s=>st[s.id]=0);const b=BEINGS.find(x=>x.id==S.cs.being);Object.entries(b.m).forEach(([k,v])=>st[k]+=v);const l=LIFESTYLES.find(x=>x.id==S.cs.life);Object.entries(l.m).forEach(([k,v])=>st[k]+=v);const f=FAMILIES.find(x=>x.id==S.cs.fam);Object.entries(f.m).forEach(([k,v])=>st[k]+=v);const c=CHALLENGES.find(x=>x.id==S.cs.ch);Object.entries(c.m).forEach(([k,v])=>st[k]+=v);if(S.cs.mod&&S.cs.mod!='none'){const m=MODS.find(x=>x.id==S.cs.mod);Object.entries(m.s).forEach(([k,v])=>st[k]+=v)}Object.entries(S.ev).forEach(([k,v])=>st[k]+=Math.floor(v/2));let tp=50+f.y+c.y;if(st.vitality>0)tp+=Math.floor(st.vitality/2);if(st.vitality<0)tp+=Math.floor(st.vitality/2);S.life={goal:S.cs.goal,being:S.cs.being,life:S.cs.life,era:S.cs.era,reg:S.cs.reg,fam:S.cs.fam,ch:S.cs.ch,name:S.cs.name||'Unnamed',ava:S.cs.ava,mod:S.cs.mod,age:0,tp:tp,st:st,used:[],sc:null,cm:false,ci:-1,ga:50,le:{},ly:0,la:false,lm:false,pu:{},fa:false,iw:false,cf:false,ps:false,cs:false,wm:false,ef:false,tr:false,lc:null};S.lives++;nextSc()}
function nextSc(){const L=S.life;if(L.age>=L.tp&&!L.ef){endLife();return}let sg='childhood';if(L.age>=12)sg='adolescence';if(L.age>=18)sg='young_adult';if(L.age>=30)sg='adult';if(L.age>=50)sg='elder';let av=SCEN.filter(s=>s.s==sg&&!L.used.includes(s.id));if(!av.length)av=SCEN.filter(s=>!L.used.includes(s.id));if(!av.length){L.used=[];av=SCEN.filter(s=>s.s==sg);if(!av.length)av=SCEN}L.sc=pick(av);L.cm=false;L.ci=-1;rGame()}
function mkChoice(i){const L=S.life;const sc=L.sc;const ch=sc.c[i];const gc=GOALS.find(g=>g.id==L.goal).c;let ef={...ch.e};if(L.iw){Object.keys(ef).forEach(k=>{if(ef[k]<0)ef[k]=0});L.iw=false}if(L.cf){Object.keys(ef).forEach(k=>{if(ef[k]>0)ef[k]*=2});L.cf=false}if(L.ps){STATS.forEach(s=>ef[s.id]=(ef[s.id]||0)+2);L.tp+=3;L.ps=false}if(L.wm){ef.wealth=(ef.wealth||0)+3;STATS.forEach(s=>{if(s.id!='wealth')ef[s.id]=(ef[s.id]||0)+1})}Object.entries(ef).forEach(([k,v])=>L.st[k]=(L.st[k]||0)+v);let yc=ch.y;if(L.ef&&yc<0)yc=0;L.tp+=yc;const ya=3+Math.floor(Math.random()*3);L.age+=ya;L.ly=yc;L.le=ef;const al=ch.a.includes(gc);const ml=ch.b.includes(gc);if(al)L.ga=Math.min(100,L.ga+8);else if(ml)L.ga=Math.max(0,L.ga-8);L.la=al;L.lm=ml;if(L.fa)L.fa=false;L.cm=true;L.ci=i;L.used.push(sc.id);L.lc={ef:{...ef},y:yc,ya:ya,sc:sc};if(L.age>=L.tp&&!L.ef){rGame();setTimeout(endLife,1800)}else rGame()}
function actPow(pid){const L=S.life;const p=POWERS.find(x=>x.id==pid);if(!p||(L.pu[pid]||0)>=p.u)return;L.pu[pid]=(L.pu[pid]||0)+1;switch(pid){case'foresight':L.fa=true;break;case'vital_surge':L.tp+=5;break;case'iron_will':L.iw=true;break;case'mind_meld':break;case'empathic_bond':break;case'creative_flow':L.cf=true;break;case'chrono_step':if(L.lc){Object.entries(L.lc.ef).forEach(([k,v])=>L.st[k]-=v);L.tp-=L.lc.y;L.age-=L.lc.ya;L.used.pop();L.cm=false;L.sc=L.lc.sc;L.lc=null}break;case'power_surge':L.ps=true;break;case'shadow_walk':L.used.push(L.sc.id);nextSc();return;case'cosmic_sight':L.cs=true;break;case'life_weave':const v=Object.values(L.st);const a=Math.round((Math.max(...v)+Math.min(...v))/2);STATS.forEach(s=>L.st[s.id]=a);break;case'wealth_manifest':L.wm=true;break;case'eternal_flame':L.ef=true;break;case'transcendence':L.tr=true;endLife();return;case'reality_shift':STATS.forEach(s=>L.st[s.id]+=3);L.tp+=5;break}rGame()}
function endLife(){const L=S.life;const en=getEnd(L);const tot=Object.values(L.st).reduce((a,b)=>a+b,0);const eg=Math.max(1,Math.floor(tot/8));const gb=L.ga>=70?2:L.ga>=50?1:0;const tg=eg+gb;S.past.push({l:S.lives,e:en.title,age:L.age,ga:L.ga,tot:tot,eg:tg});const ss=Object.entries(L.st).sort((a,b)=>b[1]-a[1]);for(let i=0;i<tg&&i<ss.length;i++)S.ev[ss[i][0]]=(S.ev[ss[i][0]]||0)+1;showEnd(en,eg,gb)}
function getEnd(L){const t=Object.values(L.st).reduce((a,b)=>a+b,0);const m=Math.max(...Object.values(L.st));const ms=Object.entries(L.st).find(([k,v])=>v==m)[0];const al=L.ga;if(L.tr)return{title:'Transcendence',text:'You break the cycle. Your consciousness expands beyond the physical plane, beyond time, beyond death itself. The cycle cannot hold you anymore.'};if(t>=80&&al>=80)return{title:'Enlightened Master',text:'You achieved what few beings ever have. Every choice led to this moment of total clarity. You see the pattern, and you are part of it.'};if(m>=20&&ms=='consciousness')return{title:'Cosmic Awakening',text:'Your consciousness expanded beyond your form. You see the connections between all things, the web that binds the cosmos.'};if(m>=20&&ms=='power')return{title:'Legend',text:'Your name will be spoken for millennia. The things you built will outlast the stars themselves.'};if(m>=20&&ms=='compassion')return{title:'Bodhisattva',text:'You could have transcended, but you chose to stay. Your compassion keeps you in the cycle, not from bondage but from love.'};if(m>=20&&ms=='creativity')return{title:'Eternal Artist',text:'Your creations echo through time. Every piece carries a fragment of your soul, and through them, you live on.'};if(m>=20&&ms=='resilience')return{title:'Indomitable',text:'Nothing could break you. Not time, not suffering. You endured, and in enduring, became unbreakable.'};if(al>=70)return{title:'Fulfilled Purpose',text:'You stayed true to your goal through every trial. The path was not easy, but it was yours. You die knowing you accomplished what you set out to do.'};if(al<30)return{title:'Lost Way',text:'You wandered far from your intended path. The life you lived was not the one you chose. Perhaps next time, you will find your way back.'};if(L.age<25)return{title:'Tragic End',text:'Your life was cut short before its time. So much potential, so many unlived years. The cosmos weeps for what could have been.'};if(L.age>80)return{title:'Long Life',text:'You lived longer than most could dream. Every year was a gift. You leave this life full and complete.'};if(t<10)return{title:'Lost Soul',text:'Your life passed without purpose. You drifted, touching nothing, changing nothing. The cycle claims you, unchanged.'};return{title:'Peaceful Passing',text:'Your life comes to a quiet close. It was not extraordinary, but it was yours. You lived, you loved, you learned. And now, you rest.'}}
function showEnd(en,eg,gb){const L=S.life;const tot=Object.values(L.st).reduce((a,b)=>a+b,0);const g=GOALS.find(x=>x.id==L.goal);R(`<div style="padding-top:24px"><div style="text-align:center;margin-bottom:16px"><div class="accent" style="font-size:22px;font-weight:bold">${en.title}</div><div class="muted" style="font-size:11px;margin-top:4px">Life ${S.lives} · ${BEINGS.find(b=>b.id==L.being).n} · ${ERAS.find(e=>e.id==L.era).n}</div></div><div class="card" style="cursor:default"><p style="font-size:14px;line-height:1.7">${en.text}</p></div><div class="card" style="cursor:default;margin-top:10px"><div class="slabel" style="margin-top:0">Final Stats (Age ${L.age})</div><div class="sgrid">${STATS.map(s=>`<div class="scell${L.st[s.id]>=10?' hi':''}"><div class="a">${s.a}</div><div class="v">${L.st[s.id]||0}</div></div>`).join('')}</div><div style="font-size:13px;margin-top:8px"><span class="muted">Goal: </span><span style="font-weight:600">${g.n}</span><span class="muted"> · Alignment: </span><span style="font-weight:600;${L.ga>=50?'color:#a5b4fc':'color:#f87171'}">${L.ga}%</span></div><div style="font-size:13px;margin-top:4px"><span class="muted">Total: </span><span style="font-weight:600">${tot}</span><span class="muted"> · Evolution: </span><span class="accent" style="font-weight:600">+${eg}</span>${gb>0?`<span class="accent"> (+${gb} goal bonus)</span>`:''}</div></div>${S.past.length>1?`<div class="card" style="cursor:default"><div class="slabel" style="margin-top:0">Past Lives</div>${S.past.slice(-5).map(p=>`<div style="font-size:12px;display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid rgba(255,255,255,0.08)"><span class="muted">Life ${p.l}: ${p.e}</span><span class="accent">+${p.eg} evo</span></div>`).join('')}</div>`:''}<div style="margin-top:16px"><button class="btn btn-p" onclick="reinc()">Reincarnate</button><button class="btn btn-s" style="margin-top:8px" onclick="showGate()">Return to Threshold</button></div></div>`)}
function reinc(){S.cs={goal:null,being:null,life:null,era:null,reg:null,fam:null,ch:null,name:'',ava:{body:null,head:null,eyes:null,markings:null,attire:null,distinguishing:null},mod:null};S.life=null;showGoal()}

function rGame(){const L=S.life;const sc=L.sc;const c=ctx();const g=GOALS.find(x=>x.id==L.goal);const e=tEvo();const up=POWERS.filter(p=>e>=p.re&&eLvl(p.rs)>=p.rl&&(!p.tp||p.tp=='active'));let h='<div class="fade"><div class="card" style="cursor:default;position:sticky;top:0;z-index:10"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:14px;font-weight:bold">Age '+L.age+'</span><span class="muted" style="font-size:11px">Limit: '+L.tp+' yrs</span>'+(L.age>=50?'<span class="accent" style="font-size:10px;font-weight:bold">REINCARNATE READY</span>':'')+'</div><div class="bar" style="margin-bottom:8px"><div class="bar-f" style="width:'+Math.min(100,L.age/L.tp*100)+'%;background:'+(L.age>=L.tp?'#f87171':'#818cf8')+'"></div></div><div class="muted" style="font-size:10px;margin-bottom:2px">'+g.n+' · Alignment: '+L.ga+'%</div><div class="bar" style="margin-bottom:8px"><div class="bar-f" style="width:'+L.ga+'%;background:'+(L.ga>=50?'#818cf8':'#f87171')+'"></div></div><div class="sgrid">'+STATS.map(s=>`<div class="scell${L.st[s.id]>=10?' hi':''}"><div class="a">${s.a}</div><div class="v">${L.st[s.id]||0}</div></div>`).join('')+'</div></div>';if(up.length){h+='<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">';up.forEach(p=>{const rem=p.u-(L.pu[p.id]||0);if(rem>0)h+=`<button class="pw" onclick="actPow('${p.id}')" style="padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#e2e8f0;font-size:11px;font-weight:600;cursor:pointer" title="${p.d}">${p.n} ×${rem}</button>`;else h+=`<span style="padding:5px 10px;border-radius:8px;font-size:11px;opacity:.3">${p.n} ×0</span>`});h+='</div>'}const ap=[];if(L.fa)ap.push('Foresight');if(L.iw)ap.push('Iron Will');if(L.cf)ap.push('Creative Flow');if(L.ps)ap.push('Power Surge');if(L.cs)ap.push('Cosmic Sight');if(L.wm)ap.push('Wealth Manifest');if(L.ef)ap.push('Eternal Flame');if(ap.length)h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${ap.map(p=>`<span class="badge badge-p">⚡ ${p}</span>`).join('')}</div>`;if(!L.cm&&sc){h+=`<div class="card" style="cursor:default"><div class="accent" style="font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">${sc.t}</div><p style="font-size:14px;line-height:1.7">${fill(sc.x,c)}</p></div>`;sc.c.forEach((ch,i)=>{h+=`<button class="choice" onclick="mkChoice(${i})"><p style="font-size:13px;font-weight:500">${ch.t}</p>`;if(L.fa||L.cs){const es=Object.entries(ch.e).map(([k,v])=>`${v>0?'+':''}${v} ${statN(k).a}`).join(' · ');h+=`<p class="muted" style="font-size:11px;margin-top:4px">${es} · ${ch.y>0?'+':''}${ch.y} yrs</p>`}if(L.cs){const gc=g.c;if(ch.a.includes(gc))h+='<p class="accent" style="font-size:10px;margin-top:2px">✓ Aligns with your goal</p>';else if(ch.b.includes(gc))h+='<p class="warn" style="font-size:10px;margin-top:2px">✗ Diverges from your goal</p>'}h+='</button>'})}else if(L.cm&&sc){const ch=sc.c[L.ci];h+=`<div class="outcome"><p style="font-size:14px;line-height:1.7;margin-bottom:12px">${fill(ch.o,c)}</p><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">${Object.entries(L.le).map(([k,v])=>`<span class="badge ${v>0?'badge-p':'badge-n'}">${statN(k).a} ${v>0?'+':''}${v}</span>`).join('')}<span class="badge ${L.ly>0?'badge-p':L.ly<0?'badge-n':'badge-m'}">${L.ly>0?'+':''}${L.ly} yrs</span></div>${L.la?'<p class="accent" style="font-size:11px;font-weight:600">✓ Aligned with your goal</p>':L.lm?'<p class="warn" style="font-size:11px;font-weight:600">✗ Diverged from your goal</p>':'<p class="muted" style="font-size:11px">— Neutral to your goal</p>'}</div>`;if(L.age<L.tp||L.ef)h+='<button class="btn btn-p" onclick="nextSc()">Continue</button>';else h+='<p class="muted" style="text-align:center;margin-top:8px;font-size:13px">Your time has come...</p>'}if(L.age>=50&&!L.cm)h+='<button class="btn btn-s" style="margin-top:8px" onclick="endLife()">Reincarnate Now</button>';h+='</div>';document.getElementById('root').innerHTML=h}

function showAscend(){const e=tEvo();R('<div style="padding-top:40px;text-align:center"><div style="font-size:28px;font-weight:800;color:#c084fc;letter-spacing:-0.03em">\u2726 Ascension \u2726</div><p class="subtitle" style="margin-top:12px;max-width:500px;margin-left:auto;margin-right:auto">After '+S.lives+' lives and '+e+' total evolution, your soul has grown beyond the need for reincarnation. You may now evolve outside the cycle \u2014 a continuous existence beyond birth and death.</p><div class="sgrid" style="max-width:400px;margin:20px auto">'+STATS.map(s=>'<div class="scell'+(S.ev[s.id]>=10?' hi':'')+'"><div class="a">'+s.a+'</div><div class="v">'+S.ev[s.id]+'</div></div>').join('')+'</div>'+(S.past.length>0?'<div class="card" style="cursor:default;max-width:500px;margin:0 auto"><div class="slabel" style="margin-top:0">Your Journey</div>'+S.past.map(p=>'<div style="font-size:12px;display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid rgba(255,255,255,0.08)"><span class="muted">Life '+p.l+': '+p.e+'</span><span class="accent">+'+p.eg+' evo</span></div>').join('')+'</div>':'')+'<div style="margin-top:24px"><button class="btn btn-p" style="background:#a855f7;color:#fff" onclick="startAscend()">Transcend the Cycle</button><button class="btn btn-s" style="margin-top:8px" onclick="showGate()">Return to Cycle</button></div></div>')}
function startAscend(){R('<div style="padding-top:60px;text-align:center"><div style="font-size:32px;font-weight:800;color:#c084fc;letter-spacing:-0.03em">\u2726 You Have Ascended \u2726</div><div class="card" style="cursor:default;max-width:520px;margin:24px auto"><p style="font-size:14px;line-height:1.8;color:rgba(255,255,255,0.7)">The cycle releases you. You are no longer bound by birth, death, and rebirth. Your consciousness exists now in a state of continuous evolution \u2014 growing, expanding, becoming, without the constraints of physical form or linear time.</p><p style="font-size:14px;line-height:1.8;color:rgba(255,255,255,0.7);margin-top:12px">You have evolved beyond the Living Cycle. After '+S.lives+' lives, you carry '+tEvo()+' evolution across '+STATS.filter(s=>S.ev[s.id]>0).length+' dimensions. Your past lives echo within you \u2014 every choice, every love, every loss, every transcendence.</p><p style="font-size:14px;line-height:1.8;color:#c084fc;margin-top:12px">What comes next is unwritten. It is yours to discover.</p></div><div style="margin-top:24px"><button class="btn btn-p" style="background:#a855f7;color:#fff" onclick="newCycle()">Start a New Cycle</button><button class="btn btn-s" style="margin-top:8px" onclick="showGate()">Return to the Threshold</button></div></div>')}
function newCycle(){S.lives=0;S.ev={};S.past=[];S.pp=0;STATS.forEach(s=>S.ev[s.id]=0);S.life=null;S.cs={goal:null,being:null,life:null,era:null,reg:null,fam:null,ch:null,name:'',ava:{body:null,head:null,eyes:null,markings:null,attire:null,distinguishing:null},mod:null};showGate()}

function initSF(){const c=document.getElementById('sf'),x=c.getContext('2d');let w,h,st,nb;function init(){w=c.width=innerWidth;h=c.height=innerHeight;st=Array.from({length:200},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.3,t:Math.random()*6.28,s:0.01+Math.random()*0.03,h:Math.random()<0.1?200+Math.random()*60:null}));nb=Array.from({length:3},()=>({x:Math.random()*w,y:Math.random()*h,r:200+Math.random()*300,h:220+Math.random()*80,a:0.03+Math.random()*0.04}))}init();addEventListener('resize',init);function dr(){x.fillStyle='#050510';x.fillRect(0,0,w,h);nb.forEach(n=>{const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);g.addColorStop(0,`hsla(${n.h},70%,50%,${n.a})`);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,w,h)});st.forEach(s=>{s.t+=s.s;const o=0.3+Math.abs(Math.sin(s.t))*0.7;x.fillStyle=s.h?`hsla(${s.h},80%,70%,${o})`:`rgba(255,255,255,${o})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});requestAnimationFrame(dr)}dr()}
initSF();showGate();
