#sf{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

.slide-in-up{animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
.slide-in-right{animation:slideRight .3s cubic-bezier(.16,1,.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fi .35s cubic-bezier(.16,1,.3,1)}
#root{transition:opacity .2s ease}
.root-transitioning{opacity:0}
@keyframes glow{0%,100%{box-shadow:0 0 6px rgba(129,140,248,.3)}50%{box-shadow:0 0 16px rgba(129,140,248,.5)}}
.pw{animation:glow 2.5s ease infinite}

.cd{font-size:11px;color:rgba(255,255,255,0.55);margin-top:3px;line-height:1.5}
.btn{width:100%;padding:12px 14px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#e2e8f0}

.btn-s{background:rgba(255,255,255,0.1)}.btn-s:hover{opacity:.85}

const ERAS=[
{id:'prehistoric',n:'Prehistoric',d:'Before civilization. Stone tools crackle in firelight as mammoths roam the tundra. Tribes gather in valleys, telling stories of spirits in the stars. Survival is daily, knowledge is oral, and the wild is home.',img:1},
{id:'ancient',n:'Ancient World',d:'The first civilizations rise between great rivers. Ziggurats pierce the sky, bronze weapons clash, and scribes press the first words into clay. Gods walk among kings, and the wheel turns for the first time.',img:1},
{id:'bronze_collapse',n:'Bronze Collapse',d:'Civilizations that stood for millennia crumble in a generation. Cities burn, trade routes sever, and writing itself is nearly lost. In the darkness, survivors rebuild from rubble, carrying fragments of a forgotten golden age.',img:0},
{id:'medieval',n:'Medieval',d:'Castles crown the hills and cathedrals scrape the sky. Knights swear fealty, plagues reshape nations, and faith is both sword and shield. In villages and monasteries, the seeds of the future are quietly sown.',img:1},
{id:'golden_age',n:'Golden Age',d:'A legendary era whispered about in myths. Crystal cities gleam, wisdom flows freely, and beings of light walk among mortals. Peace is not the absence of conflict but the presence of understanding. This is what civilization can be.',img:0},
{id:'renaissance',n:'Renaissance',d:'Art, science, and curiosity are reborn. Painters discover perspective, astronomers discover the cosmos, and thinkers rediscover the ancients. Every corner holds a new idea, every canvas a new world. The future begins to accelerate.',img:1},
{id:'industrial',n:'Industrial',d:'Steam drives machines that never sleep. Factories replace workshops, cities explode with workers, and progress has a price paid in coal and sweat. The old world dies; the modern world is being forged in iron and fire.',img:0},
{id:'modern',n:'Modern',d:'Information flows at the speed of light. Skyscrapers, smartphones, and social movements reshape society hourly. Everything is connected, everything is accelerating, and the individual navigates an ocean of noise and opportunity.',img:1},
{id:'post_apoc',n:'Post-Apocalyptic',d:'The old world is dust and memory. Survivors scavenge ruins for technology they no longer understand. New communities form around water, food, and ammunition. The future is unwritten, and the past is a warning no one heeded.',img:0},
{id:'near_future',n:'Near Future',d:'Mars colonies glow red under twin moons. Neural links connect minds directly to networks. AI mentors guide children, and the line between human and machine begins to blur. The species is on the edge of transformation.',img:1},
{id:'singularity',n:'Singularity',d:'AI has surpassed its creators. Consciousness exists in silicon and carbon alike. The merger between human and machine is not optional — it is the new nature of being. Physical and digital realities weave together seamlessly.',img:0},
{id:'interstellar',n:'Interstellar',d:'Humanity has reached the stars. Colony ships cross voids, ring worlds orbit distant suns, and beings born on other worlds know Earth only as a story. The cosmos is vast, and it is full of neighbors.',img:1},
{id:'galactic',n:'Galactic Empire',d:'A civilization spanning the galaxy. Capital worlds gleam with impossible wealth while frontier outposts struggle. Power is measured in star systems, and the fate of trillions rests on the decisions of a few. The empire endures — but for how long?',img:0},
{id:'cosmic',n:'Cosmic Era',d:'Beyond planets, beyond stars, beyond physical need. Consciousness manifests as energy, thought, and pattern. Beings communicate through resonance, and the universe itself is the canvas. This is existence at its most fundamental.',img:1},
{id:'heat_death',n:'Heat Death',d:'The last stars flicker. Entropy has nearly won. The universe is dark, cold, and nearly empty. A few conscious beings huddle around the dying warmth, preserving memory and meaning in a cosmos that has nearly forgotten both. The end approaches.',img:0},
];

{id:'full_moon',s:'adult',t:'The Full Moon',x:"The moon rises full and heavy, and something primal stirs in your chest. Your skin itches. Your senses sharpen to a painful degree. The world looks different through animal eyes.",c:[
{t:'Let the beast run free tonight',o:"You run into the wilderness and let it take you. The night is a blur of sensation — speed, power, freedom. You wake miles from home, naked, and at peace.",e:{power:2,instinct:3,resilience:1,vitality:-1,harmony:-1,luck:1},y:1,a:['survival','spiritual'],b:['social','material']},
{t:'Chain the beast — maintain control',o:"You lock yourself away. The night is agony — every sound is a thunderclap. But you hold. By dawn, you are yourself again, exhausted but intact.",e:{willpower:3,resilience:2,power:1,instinct:-1,harmony:1,faith:1},y:1,a:['intellectual','spiritual'],b:['survival']},
{t:'Find a middle path — guided transformation',o:"You've learned to navigate the change. Not fully human, not fully beast — something in between. You prowl the edge of your nature with a guide you trust.",e:{consciousness:2,instinct:2,power:1,harmony:2,willpower:1},y:2,a:['spiritual','intellectual'],b:['material']}]},
{id:'divine_calling',s:'young_adult',t:'The Divine Calling',x:"A voice speaks to you — not in words, but in meaning. Something vast and ancient has noticed you. It offers power, purpose, and a place in a plan larger than you can comprehend. The price is everything you are.",c:[
{t:'Answer the call — serve the divine',o:"You surrender to the calling. Power flows through you like light through glass. You become an instrument of something greater. Your will is no longer entirely your own, but your purpose is absolute.",e:{faith:4,consciousness:3,power:2,compassion:2,willpower:-2,harmony:1},y:3,a:['spiritual','social'],b:['material','survival']},
{t:'Refuse — your soul is not for sale',o:"You reject the calling. The voice falls silent, but the air around you feels heavier. You've refused a god. Some doors, once closed, do not open again. But you are still yours.",e:{willpower:3,resilience:2,consciousness:1,faith:-2,harmony:1,instinct:1},y:2,a:['survival','intellectual'],b:['spiritual']},
{t:'Negotiate — serve on your own terms',o:"You listen, then you bargain. You will serve, but not as a slave. The divine considers your offer. It accepts — reluctantly. The arrangement is fragile, but it holds. For now.",e:{charisma:3,wisdom:2,intellect:2,faith:1,willpower:2,harmony:-1},y:2,a:['intellectual','material'],b:['spiritual']}]},
{id:'ancient_enemy',s:'adult',t:'The Ancient Enemy',x:"You encounter a being that is your natural opposite — the enemy of your kind. It recognizes you as surely as you recognize it. Something ancient and instinctive rises in both of you. There can be no peace between you.",c:[
{t:'Fight — destroy the ancient enemy',o:"You attack with everything you are. The battle is brutal and elemental — your natures repel each other like opposing magnets. When it ends, only one of you stands. The relief is ancient and primal.",e:{power:3,resilience:2,instinct:2,vitality:-2,willpower:1,compassion:-1},y:1,a:['material','survival'],b:['social','spiritual']},
{t:'Flee — this fight is not yours',o:"You run. The enemy pursues but cannot follow where you go. You escape — for now. But you will meet again. The ancient enmity does not sleep.",e:{instinct:2,resilience:1,power:-1,harmony:-1,luck:1},y:1,a:['survival'],b:['material']},
{t:'Parley — attempt the impossible',o:"You approach the enemy with open hands. It is the hardest thing you have ever done. Every cell screams at you to fight. But you talk. And something impossible happens — you find common ground in the space between your natures.",e:{charisma:3,consciousness:3,wisdom:2,compassion:2,instinct:1,willpower:2},y:2,a:['social','spiritual','intellectual'],b:['material','survival']}]},
{id:'covenant',s:'adult',t:'The Covenant',x:"A pact is offered to you — not by a god, but by something older and less categorizable. Power, knowledge, or protection, in exchange for... something. The terms are clear. The consequences are not.",c:[
{t:'Sign the covenant — take the power',o:"You bind yourself to the terms. The power comes immediately, and it is more than you imagined. But the terms are precise, and the entity does not forget. The bill will come due, and you will pay it.",e:{power:4,wealth:2,willpower:-2,harmony:-3,faith:-1,luck:-2},y:2,a:['material'],b:['spiritual','social']},
{t:'Refuse — no deal is worth your freedom',o:"You walk away. The entity watches you go with what might be amusement. You'll never know what you missed. But you sleep well, and your soul is your own.",e:{willpower:3,harmony:2,consciousness:1,faith:2,resilience:1},y:1,a:['spiritual','survival'],b:['material']},
{t:'Read the fine print — find the loophole',o:"You study the covenant for weeks, looking for the gap. You find it — a clause, an ambiguity. You sign, but on your terms. The entity is impressed. It's also angry. You've made a powerful enemy and a useful ally.",e:{intellect:4,wisdom:2,charisma:1,willpower:1,harmony:-1,instinct:1},y:3,a:['intellectual','creative'],b:['material','spiritual']}]},
{id:'child_event',s:'adult',t:'The Child',x:"A child enters your life — yours by blood, by choice, or by circumstance. It is small, helpless, and absolutely dependent on you. Everything you thought mattered suddenly matters less than this.",c:[
{t:'Devote yourself to the child completely',o:"You set everything else aside. The work, the ambition, the pursuit — all of it dims in the light of this small life. You give everything, and what you receive is something no stat can measure.",e:{compassion:4,harmony:2,charisma:1,wealth:-2,power:-1,vitality:-1,faith:1},y:3,a:['social','spiritual'],b:['material']},
{t:'Balance — keep your purpose and raise the child',o:"You find a way to do both — the work and the child, the ambition and the love. It's exhausting. It's also the most alive you've ever felt. Both things suffer a little. Both things grow.",e:{wisdom:2,resilience:2,harmony:2,compassion:2,willpower:1,creativity:1},y:2,a:['social','intellectual','survival'],b:[]},
{t:'Entrust the child to others — your path is elsewhere',o:"You place the child with those who can care for it. It is the hardest decision you've ever made. You tell yourself it's for the best. Some days, you even believe it.",e:{power:1,willpower:2,compassion:-3,harmony:-2,wisdom:1,resilience:1},y:2,a:['material','survival'],b:['social','spiritual']}]},
{id:'second_chance',s:'adult',t:'The Second Chance',x:"Someone — or something — offers you a chance to undo one thing. One choice, one moment, one regret. You can go back and choose differently. But only once, and the new choice will have its own consequences.",c:[
{t:'Take it — undo your greatest regret',o:"You reach back through time and change the one thing that has haunted you. The relief is immediate and profound. But the new path has its own sorrows — different ones, but sorrows nonetheless.",e:{wisdom:3,harmony:2,consciousness:2,willpower:-1,luck:1,faith:1},y:2,a:['spiritual','intellectual'],b:['material','survival']},
{t:'Refuse — your mistakes made you who you are',o:"You decline. Every mistake, every regret, every wrong turn — they led here. Undo them, and you undo yourself. You keep your scars. They're yours.",e:{willpower:3,resilience:2,wisdom:2,harmony:1,instinct:1},y:1,a:['survival','spiritual'],b:['material']},
{t:'Use it for someone else — undo their regret',o:"You don't use it on yourself. You give it away — to a friend, a stranger, the world. The gift of a second chance, passed forward. What returns to you is not what you expected, but it is what you needed.",e:{compassion:4,charisma:2,harmony:3,wisdom:1,faith:2,luck:1},y:2,a:['social','spiritual'],b:['material']}]},
{id:'immortal_burden',s:'elder',t:"The Immortal's Burden",x:"You have lived long enough to watch everyone you love grow old and die. The weight of it sits on your shoulders like stone. You have too many graves and too many memories.",c:[
{t:'Embrace the grief — let it make you deeper',o:"You don't harden. You let every loss carve something new into your soul — not a wound, but a canyon. Deeper, wider, more capable of holding everything. You become vast with grief, and in that vastness, there is room for something like peace.",e:{consciousness:4,compassion:3,wisdom:3,harmony:2,faith:2,vitality:-1},y:2,a:['spiritual','social'],b:['material']},
{t:'Harden your heart — never love again',o:"You close the door. No more attachments, no more goodbyes. You become untouchable. It works — the grief stops. But so does the joy. You are safe and empty.",e:{resilience:3,willpower:2,compassion:-3,harmony:-2,charisma:-1},y:1,a:['survival','material'],b:['social','spiritual']},
{t:'Find purpose in the loss — carry them forward',o:"You don't move on. You carry them. Every person you lost becomes a voice in your memory. You live not for yourself but for all of them, and in doing so, you give their lives meaning that outlasts their years.",e:{wisdom:4,compassion:3,consciousness:2,faith:2,harmony:1,willpower:1},y:3,a:['spiritual','intellectual','social'],b:['material']}]},
{id:'secret_revealed',s:'adult',t:'The Secret Revealed',x:"A secret you've kept for years — or one kept from you — surfaces. It changes everything. The truth is a knife that cuts through every relationship, every assumption, every certainty you held.",c:[
{t:'Embrace the truth — rebuild on solid ground',o:"You let the secret out and watch it reshape your world. It's painful — foundations crack, relationships fracture. But what remains is real. You build something new on truth instead of sand.",e:{wisdom:3,consciousness:2,charisma:2,harmony:1,willpower:2},y:2,a:['intellectual','social','spiritual'],b:['material']},
{t:'Bury it deeper — some truths are too dangerous',o:"You push the secret back down. You lock it away, rebuild the lie, and move on. It works — for now. But secrets are patient, and truth has a way of finding the light no matter how deep you bury it.",e:{willpower:2,resilience:1,wisdom:-1,harmony:-2,instinct:1,wealth:1},y:1,a:['survival','material'],b:['social','intellectual']},
{t:'Use the secret as leverage',o:"You hold the truth like a weapon. It gives you power over those who kept it from you. You wield it carefully, surgically. It's a dangerous game, but you're playing it well.",e:{power:3,charisma:2,intellect:1,compassion:-2,harmony:-2,wealth:1},y:1,a:['material'],b:['social','spiritual']}]},
{id:'love_triangle',s:'young_adult',t:'The Love Triangle',x:"Two people hold your heart, each in a different way. One is fire — passion, excitement, the feeling of being truly alive. The other is warmth — comfort, safety, the feeling of being truly home. You cannot have both.",c:[
{t:'Choose the fire — passion over safety',o:"You choose the one who makes your blood race. The early days are intoxicating, a blur of laughter and reckless nights. But fire burns, and eventually, you must decide whether the warmth of the ashes is enough.",e:{charisma:2,creativity:2,compassion:1,harmony:-1,vitality:1,looks:1},y:3,a:['social','creative'],b:['intellectual','survival']},
{t:'Choose the warmth — home over adventure',o:"You choose the one who makes you feel safe. The early days are quiet, steady, real. There are no fireworks, but there is something better — the feeling of being known, completely, and loved anyway.",e:{compassion:3,harmony:3,wisdom:1,charisma:1,creativity:-1},y:3,a:['social','spiritual'],b:['material','creative']},
{t:'Refuse both — you will not choose by halves',o:"You walk away from both. It is the hardest thing you have ever done. You tell yourself that love should not require a choice, that someday you will find someone who is both fire and warmth. You hope you are right.",e:{willpower:3,wisdom:2,harmony:1,compassion:-2,instinct:1,resilience:1},y:2,a:['intellectual','spiritual'],b:['social']}]},
{id:'long_distance',s:'young_adult',t:'The Distance',x:"The one you love must go far away — for work, for family, for war, for a calling you cannot follow. The distance stretches between you like a wire pulled taut. Love at a distance is a different animal. Quieter. Harder. More real in some ways, less real in others.",c:[
{t:'Wait — love is worth the distance',o:"You wait. Letters, calls, visits when you can. The distance tests you in ways proximity never did. Some days the waiting feels like faith. Other days it feels like fool's errand. But you hold on, because the alternative is letting go.",e:{willpower:3,compassion:2,harmony:1,faith:1,instinct:-1,resilience:1},y:3,a:['social','spiritual'],b:['material','survival']},
{t:'Follow — go with them, leave everything',o:"You pack your life into a bag and go. What you leave behind is real — friends, career, the place you knew. What you find is also real — a new world through the eyes of love, harder than you expected, but shared.",e:{compassion:3,creativity:1,wealth:-2,harmony:1,charisma:1,vitality:-1},y:3,a:['social','creative'],b:['material','intellectual']},
{t:'Let go — set them free and set yourself free',o:"You end it. Not because the love is gone, but because distance would make it something bitter. You set them free with words of love and a clean break. The grief is real. So is the relief.",e:{wisdom:3,harmony:2,compassion:-1,willpower:2,instinct:1,faith:1},y:2,a:['spiritual','intellectual'],b:['social']}]},
{id:'love_duty',s:'adult',t:'Love and Duty',x:"Your ambition calls you one direction. Your love calls you another. The promotion requires relocation. The mission requires years away. The crown requires a political marriage. Whatever it is, duty and love are pulling in opposite directions, and you cannot serve both.",c:[
{t:'Choose love — let ambition go',o:"You turn down the opportunity. You stay. The career, the mission, the throne — all of it dims beside the face of the one you love. You tell yourself you chose correctly. Most days, you believe it.",e:{compassion:3,harmony:3,wealth:-2,power:-1,wisdom:1,faith:1},y:2,a:['social','spiritual'],b:['material']},
{t:'Choose duty — let love wait',o:"You take the opportunity. You go. You promise to return, to make it work, to find a way. Promises are easier made than kept. The distance grows. The calls get shorter. You build something impressive on a foundation of absence.",e:{power:3,wealth:2,intellect:1,compassion:-2,harmony:-2,willpower:1},y:3,a:['material','intellectual'],b:['social']},
{t:'Find a way to do both — the impossible compromise',o:"You refuse to choose. Instead, you spend years building a bridge between duty and love — restructuring your life, renegotiating terms, inventing solutions no one thought of. It costs you sleep, health, and sanity. But you hold both. Barely.",e:{intellect:3,willpower:3,creativity:2,vitality:-2,harmony:1,compassion:1},y:3,a:['intellectual','creative','social'],b:['material','survival']}]},
{id:'marriage_proposal',s:'adult',t:'The Question',x:"The moment has come. You know what you want to say, but saying it changes everything. A life joined to another is a life forever different. The words wait on your tongue like birds on a wire.",c:[
{t:'Say yes — bind your life to theirs',o:"You say yes. The relief and joy in their face is something you will carry for the rest of your life. The years ahead will test the promise in ways you cannot predict, but on this day, in this moment, the promise is pure.",e:{compassion:3,harmony:3,charisma:2,faith:2,wealth:1,vitality:1},y:3,a:['social','spiritual'],b:['material']},
{t:'Say not yet — love without the chain',o:"You love them, but you are not ready to merge lives. You ask for time. They give it — graciously or not. The love continues, but something shifts. A question mark hangs where a period should be.",e:{wisdom:2,willpower:2,instinct:1,harmony:-1,charisma:1,compassion:-1},y:2,a:['intellectual','survival'],b:['social']},
{t:'Say no — love is not enough',o:"You say no. Not because you do not love them, but because you know yourself well enough to see that this would not work. The kindness of honesty is brutal in the moment and merciful in the long run. You both grieve. You both move on.",e:{wisdom:3,willpower:3,compassion:-1,harmony:1,instinct:2,faith:1},y:2,a:['intellectual','spiritual'],b:['social']}]},
{id:'love_tested',s:'adult',t:'The Love Tested',x:"Crisis strikes not you, but the one you love. Illness, scandal, ruin, disgrace. The world turns on them. You could stand by them and share the weight, or you could step back and let the tide pass. No one would blame you for stepping back. No one but yourself.",c:[
{t:'Stand by them — share the weight',o:"You stand. The world pushes, and you push back. The cost is real — your reputation, your comfort, your peace. But what you gain is something crisis cannot take: the knowledge that when it mattered, you did not flinch.",e:{compassion:4,willpower:3,harmony:2,charisma:1,wealth:-2,vitality:-1,faith:1},y:2,a:['social','spiritual'],b:['material','survival']},
{t:'Step back — protect yourself first',o:"You create distance. Not abandonment, but protection. You help from the shadows, support from the margins. They survive. You survive. But something between you has changed — a wall that wasn't there before, built of the unspoken question: where were you when it mattered?",e:{resilience:2,instinct:2,wisdom:1,compassion:-2,harmony:-1,wealth:1},y:2,a:['survival','material'],b:['social','spiritual']},
{t:'Fight the cause — attack the crisis directly',o:"You don't just stand by. You go to war with whatever caused the crisis — the illness, the rumor, the enemy. You become a weapon wielded in love's name. It consumes you, but it also saves them.",e:{power:3,willpower:2,charisma:2,compassion:2,vitality:-2,creativity:1,instinct:1},y:3,a:['social','material'],b:['survival','intellectual']}]},
{id:'rekindled',s:'adult',t:'The Rekindled Flame',x:"You see them across a room — the one who got away. Years have passed. Both of you have changed. But the spark is there, immediate and undeniable, as if time folded on itself.",c:[
{t:'Pursue it — some loves deserve a second chance',o:"You cross the room. The conversation is tentative, then electric. The years between you create depth that young love never had. This time, you are both old enough to know what you have and brave enough to hold it.",e:{compassion:3,harmony:2,charisma:2,creativity:1,wisdom:1,looks:1,faith:1},y:3,a:['social','spiritual','creative'],b:['material']},
{t:'Let it pass — the past is the past for a reason',o:"You smile, nod, and walk away. The memory of what was is perfect in its way — untainted by the complications a reunion would bring. You keep the warmth without reopening the wound. Some loves are best as memories.",e:{wisdom:3,harmony:2,willpower:2,compassion:-1,instinct:1,resilience:1},y:2,a:['intellectual','spiritual'],b:['social']},
{t:'Reconnect as friends — love in a different form',o:"You become friends. Not lovers again, but something else — people who share history and choose to share the present too. The love transforms from fire to light. Different. In some ways, better. In some ways, not.",e:{compassion:3,charisma:2,wisdom:2,harmony:2,faith:1},y:2,a:['social','spiritual'],b:['material']}]},
{id:'forbidden_love',s:'adult',t:'The Forbidden Love',x:"You fall for someone you should not love. The reasons vary — a rival, a married person, someone from the wrong family, the wrong species, the wrong side of a war. The heart does not consult the rules. The heart does not care.",c:[
{t:'Love anyway — damn the consequences',o:"You love in secret, in stolen moments, in the shadows. The danger is real. The passion is realer. Every meeting is a risk and a gift. You know this cannot last. You do it anyway. Some fires are worth burning for.",e:{creativity:3,creativity:2,charisma:2,compassion:1,harmony:-2,willpower:-1,luck:1},y:2,a:['social','creative'],b:['material','survival']},
{t:'End it — protect them and yourself',o:"You break it off. Clean, decisive, final. The look in their eyes is something you will carry to your grave. But you did it to protect them — from scandal, from danger, from you. The wound heals. The scar stays.",e:{willpower:3,wisdom:2,compassion:2,harmony:1,resilience:1,instinct:1},y:2,a:['intellectual','spiritual'],b:['social']},
{t:'Fight for it — make the forbidden acceptable',o:"You refuse to hide. You love openly and dare the world to stop you. The world tries. You lose friends, status, maybe more. But you also gain something — the freedom of someone who has chosen love over fear.",e:{willpower:3,charisma:3,compassion:2,power:1,harmony:-1,wealth:-1,instinct:1},y:3,a:['social','spiritual','material'],b:['survival']}]},
{id:'growing_old',s:'elder',t:'Growing Old Together',x:"You sit beside the one you have loved for decades. The fire has become embers, but embers hold heat longer than flame. Their hand in yours is as familiar as your own. The silence between you is not empty — it is full of everything you have shared.",c:[
{t:'Speak — tell them everything you never said',o:"You talk through the night. Every unsaid word, every swallowed feeling, every secret gratitude. They listen. They speak too. By dawn, you are raw and clean and closer than you have ever been. Decades of love, finally said out loud.",e:{compassion:4,harmony:4,wisdom:3,consciousness:2,faith:2,charisma:2},y:3,a:['social','spiritual'],b:['material']},
{t:'Just sit — the silence says everything',o:"You don't need words. You sit together, watching the light change, feeling the warmth of a shared life. Everything that needed saying was said in the living of it. The silence is not absence — it is the fullest conversation you have ever had.",e:{harmony:4,consciousness:3,wisdom:2,compassion:2,faith:2,instinct:1},y:3,a:['spiritual','social'],b:['material']},
{t:'Write it down — leave a record of your love',o:"You write. Letters, poems, a journal of your years together. You want the world to know this person existed and was loved completely. The writing becomes your final gift to them and to history.",e:{creativity:3,wisdom:3,compassion:2,charisma:1,faith:1,intellect:1},y:2,a:['creative','intellectual','social'],b:['material']}]},
{id:'love_letter',s:'young_adult',t:'The Love Letter',x:"You have written the letter a hundred times in your head. The words that say what your mouth cannot. The confession sits in your hands, folded, trembling slightly. One address. One delivery. One irreversible act of courage.",c:[
{t:'Send it — courage is the only currency of love',o:"You send it. The waiting is the longest hours of your life. The reply, when it comes, changes everything — for better or worse, it changes everything. But at least you will know. At least you tried.",e:{charisma:2,willpower:2,compassion:2,creativity:1,instinct:1,looks:1},y:1,a:['social','creative'],b:['intellectual']},
{t:'Deliver it in person — face to face',o:"You show up at their door. The letter is a prop; the real message is in your eyes. You say the words out loud, trembling but clear. Whatever happens next, you will never again have to wonder what if.",e:{charisma:3,willpower:3,compassion:1,instinct:2,vitality:-1,looks:1},y:1,a:['social','survival'],b:['intellectual']},
{t:'Burn it — some words are meant to stay inside',o:"You hold the letter over a flame and watch it curl and disappear. The relief is real. The regret is also real. You keep the words inside where they are safe but also unheard. Love unspoken is love unfinished.",e:{harmony:2,willpower:2,wisdom:1,compassion:-1,creativity:1,instinct:1},y:1,a:['intellectual','spiritual'],b:['social']}]},
{id:'two_paths',s:'adult',t:'The Two Paths',x:"You and your love have grown in different directions. Not badly — just differently. They want stillness, you want movement. They want roots, you want wings. The love is still there. The life is not. You stand at a fork that runs through the middle of your shared home.",c:[
{t:'Stay — love adapts or it dies',o:"You stay. You learn to love their stillness, to appreciate what roots offer that wings cannot. It is not sacrifice — it is growth in a direction you would not have chosen alone. The love deepens into something quieter and more durable.",e:{harmony:3,compassion:3,wisdom:2,faith:1,creativity:-1,resilience:1},y:3,a:['social','spiritual'],b:['material']},
{t:'Leave — love is not a cage',o:"You leave with words of love and a broken heart. The goodbye is the kindest cruelty. You both understand. You both grieve. You both grow. Years later, you think of them with warmth and no regret. Some loves are chapters, not the whole book.",e:{willpower:3,wisdom:2,compassion:1,instinct:2,harmony:1,creativity:1},y:2,a:['intellectual','spiritual','creative'],b:['social']},
{t:'Grow together — find a third path',o:"You refuse to choose between roots and wings. Instead, you spend years learning to be someone who has both. It is the hardest work you have ever done. It is also the most rewarding. You become a person you could not have become alone.",e:{intellect:2,creativity:3,compassion:2,harmony:2,willpower:2,vitality:-1},y:3,a:['intellectual','creative','social'],b:['material','survival']}]}
,{id:'old_mentor',s:'elder',t:'The Mentor',x:"A young person seeks your wisdom. You see yourself in them — young, hungry, unafraid.",c:[
{t:'Share everything you know',o:"You pour your life's knowledge into this young soul. They drink it in, transformed by your generosity. You feel your own purpose renewed.",e:{wisdom:3,compassion:3,charisma:1,harmony:1},y:1,a:['social','spiritual']},
{t:'Test them first',o:"You give them a riddle, a task, a challenge. They struggle, but they grow. When you finally share your knowledge, they are ready for it.",e:{intellect:2,wisdom:2,willpower:1,creativity:1},y:1,a:['intellectual']},
{t:'Send them to someone wiser',o:"You tell them of an old friend, wiser than you, who lives across the mountains. The journey will teach them more than you ever could.",e:{compassion:2,harmony:2,faith:1},y:0,a:['social','spiritual']}]},
{id:'final_legacy',s:'elder',t:'Final Legacy',x:"Your body is failing, but your mind is clear. You have one last thing to give.",c:[
{t:'Write your life story',o:"You spend your final days writing. The stories pour out of you — triumphs, failures, love, loss. When you finish, you feel complete.",e:{creativity:4,wisdom:2,consciousness:2,intellect:1},y:0,a:['creative','intellectual']},
{t:'Give away your possessions',o:"You distribute everything you own to those who need it. Each gift carries a memory, a lesson. You die with nothing — and everything.",e:{wealth:-5,compassion:4,harmony:3,faith:2},y:0,a:['social','spiritual']},
{t:'Teach your secrets to an apprentice',o:"You take on a final student and teach them everything. They will carry your knowledge into the future. Your legacy is assured.",e:{wisdom:3,intellect:2,compassion:2,charisma:1},y:1,a:['intellectual','social']}]},
{id:'last_love',s:'elder',t:'Last Love',x:"In your final years, you find love again. It is different from the loves of your youth — quieter, deeper, more certain.",c:[
{t:'Embrace it fully',o:"You let yourself love without reservation. What does age matter? What does time matter? Love is love, and this love is yours.",e:{compassion:3,harmony:3,vitality:1,looks:1},y:1,a:['social','spiritual']},
{t:'Cherish it quietly',o:"You keep this love private, a treasure for only the two of you. It needs no audience, no witness. It simply is.",e:{harmony:3,compassion:2,faith:1},y:0,a:['spiritual']},

function R(h){
  var root=document.getElementById('root');
  if(!root){return}
  // If already transitioning, complete immediately and start new
  if(_RT){clearTimeout(_RT);_RT=null}
  // Fade out current content
  root.style.opacity='0';
  root.style.transform='translateY(6px)';
  root.style.transition='opacity .2s ease, transform .2s ease';
  _RT=setTimeout(function(){
    root.innerHTML=h;
    // Force reflow then fade in
    root.offsetHeight;
    root.style.opacity='1';
    root.style.transform='translateY(0)';
    _RT=null;
  },200);
}

function rollQuest(){var pool=QUESTS.filter(function(q){return !S.life.qd||!S.life.qd.includes(q.id)});if(!pool.length)pool=QUESTS;return pool[Math.floor(Math.random()*pool.length)]}
function triggerQuest(){var q=rollQuest();S.life.qd=(S.life.qd||[]).concat(q.id);showQuest(q)}
function showQuest(q){var opts=q.ch.map(function(c,i){return '<button class="btn btn-c" style="margin-top:8px;text-align:left" onclick="answerQuest('+i+')">'+c.t+'</button>'}).join('');R('<div class="fade"><div style="padding-top:24px"><div style="display:inline-block;padding:4px 12px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);border-radius:20px;font-size:10px;color:#c084fc;font-weight:600;margin-bottom:12px">QUEST</div><div class="ttl" style="font-size:20px;color:#c084fc">'+q.n+'</div><p class="sub" style="margin:12px 0;max-width:500px">'+q.d+'</p>'+opts+'</div></div>');S.life.cq=q;rGame()}
function answerQuest(i){var L=S.life;var q=L.cq;var ch=q.ch[i];Object.entries(ch.e).forEach(function(p){L.st[p[0]]=(L.st[p[0]]||0)+p[1]});if(ch.e.luck&&L.tp<L._maxTP)L.tp+=Math.min(Math.round(ch.e.luck/2),L._maxTP-L.tp);L.story=L.story||[];L.story.push({age:L.age,type:'quest',title:q.n,choice:ch.t,resolution:ch.r,stats:ch.e});try{autoLogIRL('Quest: '+q.n+' — '+ch.t,ch.e,'choice',{quest:q.n})}catch(e){};L.cq=null;if(!AE.ctx)aeInit();var _qs=Object.values(ch.e).reduce(function(a,b){return a+b},0);if(_qs>0)aeGood();else if(_qs<0)aeBad();else aeNeutral();rGame();setTimeout(function(){showQuestResult(q,ch)},100)}
function showQuestResult(q,ch){var stats=Object.entries(ch.e).map(function(p){return '<span class="bg '+(p[1]>0?'bg-p':'bg-n')+'">'+(p[1]>0?'+':'')+p[1]+' '+sN(p[0]).a+'</span>'}).join(' ');R('<div style="padding-top:30px;text-align:center"><div style="display:inline-block;padding:4px 12px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);border-radius:20px;font-size:10px;color:#c084fc;font-weight:600;margin-bottom:12px">QUEST COMPLETE</div><div style="font-size:20px;font-weight:700;color:#c084fc;margin-bottom:8px">'+q.n+'</div><div style="max-width:400px;margin:12px auto;padding:12px 16px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.3);border-radius:12px"><p style="font-size:13px;line-height:1.6;color:rgba(255,255,255,0.8);font-style:italic">'+ch.r+'</p></div><div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:400px;margin:12px auto">'+stats+'</div><div style="display:flex;gap:8px;justify-content:center;margin-top:20px"><button class="btn btn-p" style="background:#c084fc;color:#fff" onclick="rGame()">Continue</button></div></div>')}

// === MISSING CORE GAME FUNCTIONS (reconstructed) ===

function startLife(){
  av3dDestroy();
  var cs=S.cs;
  var being=BEINGS.find(function(b){return b.id==cs.being})||BEINGS[0];
  var lifestyle=LIFESTYLES.find(function(l){return l.id==cs.life})||LIFESTYLES[0];
  var family=FAMILIES.find(function(f){return f.id==cs.fam})||FAMILIES[0];
  var challenge=CHALLENGES.find(function(ch){return ch.id==cs.ch})||CHALLENGES[0];
  var goal=GOALS.find(function(g){return g.id==cs.goal})||GOALS[0];

  // Base lifespan: 70 + family/challenge modifiers
  var tp=70+(family.y||0)+(challenge.y||0);
  var maxTP=tp+15; // Cap lifespan inflation

  // Initialize life state
  S.life={
    being:cs.being, life:cs.life, era:cs.era, reg:cs.reg, goal:cs.goal, fam:cs.fam, ch:cs.ch,
    ava:cs.ava||{},
    age:0, tp:tp, _maxTP:maxTP, _hardCap:tp+30,
    st:{}, story:[], qd:[], cq:null, re:{count:0},
    amp:1
  };

  // Apply being modifiers
  Object.entries(being.m||{}).forEach(function(p){
    S.life.st[p[0]]=(S.life.st[p[0]]||0)+p[1];
  });

  // Apply lifestyle modifiers
  Object.entries(lifestyle.m||{}).forEach(function(p){
    S.life.st[p[0]]=(S.life.st[p[0]]||0)+p[1];
  });

  // Apply family modifiers
  Object.entries(family.m||{}).forEach(function(p){
    S.life.st[p[0]]=(S.life.st[p[0]]||0)+p[1];
  });

  // Apply challenge modifiers
  Object.entries(challenge.m||{}).forEach(function(p){
    S.life.st[p[0]]=(S.life.st[p[0]]||0)+p[1];
  });

  // Apply meta-upgrades
  applyUpgrades(S.life);

  // Track last stats for memory upgrade
  S._lastStats=null;

  S.lives=(S.lives||0)+1;

  // Log life start to IRL
  try{autoLogIRL('Life '+(S.lives)+' began as '+being.n,{},'life',{being:cs.being,era:cs.era})}catch(e){}

  rGame();
}

function getAgeStage(age,tp){
  var pct=age/tp;
  if(pct<0.15)return 'childhood';
  if(pct<0.25)return 'adolescence';
  if(pct<0.45)return 'young_adult';
  if(pct<0.75)return 'adult';
  return 'elder';
}
function applyAging(L){
  var pct=L.age/L.tp;
  if(pct<0.80)return; // No decay before late elder years
  // Gentle decay: -1 to physical stats per year, only in final 20% of life
  if(pct>0.80&&Math.random()<0.5){
    var stats=['vitality','looks'];
    var s=stats[Math.floor(Math.random()*stats.length)];
    L.st[s]=(L.st[s]||0)-1;
  }
  if(pct>0.92&&Math.random()<0.3){
    L.st.power=(L.st.power||0)-1;
  }
}

  if(S.life&&S.life.cq)return;

  }).join('');

  var eraName=(ERAS.find(function(e){return e.id==L.era})||{}).n||'Unknown';

  var goalName=(GOALS.find(function(g){return g.id==L.goal})||{}).n||'Unknown';
  var stageLabels={childhood:'Childhood',adolescence:'Adolescence',young_adult:'Young Adult',adult:'Adulthood',elder:'Elder Years'};
  var stageLabel=stageLabels[stage]||stage;

  R('<div class="fade" style="padding-top:16px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'  <div><div style="font-size:11px;color:rgba(255,255,255,0.4)">Year '+L.age+' · '+stageLabel+'</div><div style="font-size:13px;font-weight:600">'+beingName+' in '+eraName+'</div></div>'
    +'  <div style="text-align:right"><div style="font-size:11px;color:rgba(255,255,255,0.4)">Lifespan</div><div style="font-size:13px;font-weight:600">'+L.age+'/'+L.tp+'</div></div>'
    +'</div>'
    +'<div class="bar" style="margin-bottom:16px"><div class="bf" style="width:'+progress+'%;background:linear-gradient(90deg,#818cf8,#a5b4fc)"></div></div>'

function nextYear(){
  var L=S.life;
  if(!L)return;
  L.age++;
  applyAging(L);

  // Check death
  if(L._ended){return;}
  if(L.age>=L.tp||L.age>=L._hardCap){
    endLife();
    return;
  }

  var stage=getAgeStage(L.age,L.tp);
  var rolledSomething=false;

  // Roll for scenario (choice-driven story event) — higher chance in certain stages
  var scenChance=0.35;
  var pool=SCEN.filter(function(s){return s.s===stage&&(!L.sd||!L.sd.includes(s.id))});
  if(pool.length>0&&Math.random()<scenChance){
    var scen=pool[Math.floor(Math.random()*pool.length)];
    L.sd=(L.sd||[]).concat(scen.id);
    showScen(scen);
    rolledSomething=true;
    return;
  }

  // Roll for random event
  if(Math.random()<getEventChance()){
    triggerEvent();
    rolledSomething=true;
    return;
  }

  // Roll for quest
  if(Math.random()<getQuestChance()){
    triggerQuest();
    rolledSomething=true;
    return;
  }

  // Nothing happened — continue
  if(!rolledSomething){
    rGame();
  }
}

  var c=ctx();

function answerScen(scenId,choiceIdx){
  var L=S.life;

  if(!scen)return rGame();
  var ch=scen.c[choiceIdx];
  var amp=L.amp||1;

  Object.entries(ch.e).forEach(function(p){
    L.st[p[0]]=(L.st[p[0]]||0)+Math.round(p[1]*amp);

function endLife(){

  if(!L||L._ended)return;
  L._ended=true;

function avaSwitchTab(t){
  if(AVA_TAB===t)return;
  var panel=document.getElementById('avaTabContent');
  if(panel){
    panel.style.opacity='0';
    panel.style.transform='translateX(15px)';
    panel.style.transition='opacity .15s ease, transform .15s ease';
    setTimeout(function(){
      AVA_TAB=t;
      showAva();
      var np=document.getElementById('avaTabContent');
      if(np){
        np.style.opacity='0';
        np.style.transform='translateX(15px)';
        np.offsetHeight;
        np.style.transition='opacity .25s cubic-bezier(.16,1,.3,1), transform .25s cubic-bezier(.16,1,.3,1)';
        np.style.opacity='1';
        np.style.transform='translateX(0)';
      }
    },150);
  }else{
    AVA_TAB=t;
    showAva();
  }
}

    AV3D.group.userData.transitioning=true;
    setTimeout(function(){

  var presets={

function avaSetColor(key,color){
  if(!S.cs.ava)S.cs.ava={};
  S.cs.ava[key]=[color];
  // Smooth 3D color transition
  if(AV3D.initDone&&AV3D.group){
    AV3D.group.traverse(function(obj){
      if(obj.material&&obj.material.color){
        var startC=obj.material.color.clone();
        var endC=new THREE.Color(color);
        var t0=performance.now();
        var dur=300;
        var anim=function(){
          var t=Math.min(1,(performance.now()-t0)/dur);
          var eased=1-Math.pow(1-t,3);
          // Only transition the matching material
          obj.material.color.lerpColors(startC,endC,eased);
          if(t<1)requestAnimationFrame(anim);
        };
        // Only animate skin materials for skin changes, hair for hair, etc.
        if((key==='skin_tone'&&obj.userData.isSkin)||(key==='hair_color'&&obj.userData.isHair)||(key==='eye_color'&&obj.userData.isEyes)){
          anim();
        }
      }
    });
  }
  showAva();
}

function avaSetMulti(key,val){
  if(!S.cs.ava)S.cs.ava={};
  if(!S.cs.ava[key])S.cs.ava[key]=[];
  if(S.cs.ava[key].indexOf(val)>=0){
    if(S.cs.ava[key].length>1)S.cs.ava[key]=S.cs.ava[key].filter(function(x){return x!==val});
  }else{
    S.cs.ava[key]=[val];
  }
  showAva();
}

  keyLight.shadow.camera.right=3;
  keyLight.shadow.camera.top=3;
  keyLight.shadow.camera.bottom=-1;

  keyLight.shadow.camera.far=15;

  var groundMat=new THREE.ShadowMaterial({opacity:0.35});

  ground.position.y=0;
  ground.receiveShadow=true;

  window.addEventListener('pointerup',function(){isDown=false;});
  window.addEventListener('pointermove',function(e){
    if(!isDown||!AV3D.group)return;
    AV3D.rotY+=(e.clientX-lastX)*0.01;

  },{passive:false});

  AV3D.initDone=true;
  av3dRebuild();

}

function av3dRot(amount){AV3D.rotY+=amount;}
function av3dZoom(amount){AV3D.zoom=Math.max(1.8,Math.min(6,AV3D.zoom+amount));AV3D.camera.position.z=AV3D.zoom;}

function av3dClear(){
  if(!AV3D.group)return;
  while(AV3D.group.children.length>0){
    var obj=AV3D.group.children[0];
    AV3D.group.remove(obj);
    if(obj.geometry)obj.geometry.dispose();
    if(obj.material){
      if(Array.isArray(obj.material))obj.material.forEach(function(m){m.dispose();});
      else obj.material.dispose();
    }
  }
}

function av3dMat(color,opts){

    transparent:opts.alpha?true:false,
    opacity:opts.alpha||1,
    emissive:new THREE.Color(opts.emit||0),
    emissiveIntensity:opts.ei||0
  });
  return m;
}

// ===== JSON-DRIVEN AVATAR BLUEPRINT =====
// ===== SCULPTED AVATAR SYSTEM =====
// Vertex-sculpted high-resolution meshes for human appearance

function av3dRebuild(){
  if(!AV3D.initDone||!AV3D.group)return;
  av3dClear();

  // === READ SETTINGS ===
  var a=S.cs.ava||{};
  var gender=(a.gender&&a.gender[0])||'female';
  var skinC=(a.skin_tone&&a.skin_tone[0])||'#d4a070';
  var hairC=(a.hair_color&&a.hair_color[0])||'#5c3a1e';
  var eyeC=(a.eye_color&&a.eye_color[0])||'#5a4a2a';
  var hairStyle=(a.hair_style&&a.hair_style[0])||'Medium';
  var outfit=(a.outfit&&a.outfit[0])||'Casual';
  var heightCm=a.height_cm||170;
  var weightKg=a.weight_kg||65;
  var muscle=a.muscle||0.5;
  var shoulderW=a.shoulder_w||1.0;
  var waistW=a.waist_w||0.85;
  var hipW=a.hip_w||0.95;
  var headW=a.head_w||1.0;
  var headH=a.head_h||1.0;
  var eyeSize=a.eye_size||1.0;
  var noseW=a.nose_w||1.0;
  var noseL=a.nose_l||1.0;
  var lipSz=a.lip_size||1.0;
  var jawW=a.jaw_w||1.0;
  var browPos=a.brow_pos||1.0;
  var noseShape=(a.nose_shape&&a.nose_shape[0])||'';
  var wingStyle=(a.wing_style&&a.wing_style[0])||'';
  var wingColor=(a.wing_color&&a.wing_color[0])||'#ffffff';
  var wingSize=a.wing_size||1.0;
  var wingSpread=a.wing_spread||0.8;
  // Auto-assign wings based on being type if not explicitly set
  if(!wingStyle&&S.cs.being){
    var wingBeings={'angel':'Feathered','celestial':'Feathered','nephilim':'Feathered','fae':'Fairy','phoenix':'Fire','dragon':'Dragon','demon':'Bat','ghost':'Energy','void_walker':'Energy','energy':'Energy','spirit':'Energy','fairy':'Butterfly'};
    wingStyle=wingBeings[S.cs.being]||'';
  }

  // === COMPUTE VARIABLES ===
  var hs=heightCm/170;
  var ws=0.8+weightKg/100;
  var ms=1+muscle*0.3;
  var hR=0.11*headW, hL=0.13*headH;
  var neckR=0.07;
  var torsoLen=0.48*hs;  // slightly shorter torso for better proportions
  var shoulderR=0.17*shoulderW; // narrower shoulders
  var waistR=0.12*waistW*ws;   // more defined waist
  var hipR=0.17*hipW;          // fuller hips
  var armR=0.045*ms;           // slightly slimmer arms
  var legR=0.075*ms;           // slightly slimmer legs
  var legLen=0.75*hs;
  var hipY=legLen;
  var shoulderY=hipY+torsoLen;
  var neckY=shoulderY+neckR;
  var headCY=neckY+hR+0.04;
  var upperArmLen=0.28*hs;
  var forearmLen=0.25*hs;
  var thighLen=legLen*0.55;
  var calfLen=legLen*0.45;
  var legSpread=0.05+legR*0.3;

  // === MATERIALS (upgraded to MeshPhysicalMaterial for skin sheen) ===
  function skinMat(color,opts){
    opts=opts||{};
    var c=new THREE.Color(color);
    return new THREE.MeshStandardMaterial({
      color:c, roughness:opts.rough||0.65, metalness:0,
      emissive:c.clone().multiplyScalar(0.02), emissiveIntensity:0.15,
      flatShading:false
    });
  }
  function basicMat(color,opts){
    opts=opts||{};
    return new THREE.MeshStandardMaterial({
      color:new THREE.Color(color),
      roughness:opts.rough||0.5, metalness:opts.metal||0,
      transparent:opts.alpha?true:false, opacity:opts.alpha||1,
      emissive:new THREE.Color(opts.emit||0), emissiveIntensity:opts.ei||0
    });
  }

  var sMat=skinMat(skinC);
  var sDark=skinMat(skinC,{rough:0.6});
  var hMat=basicMat(hairC,{rough:0.25,metal:0.15});
  var hDark=basicMat(hairC,{rough:0.3,metal:0.1,emit:0x000000,ei:0.05});
  var eyeWMat=basicMat('#ffffff',{rough:0.1});
  var irisMat=basicMat(eyeC,{rough:0.2,metal:0.4});
  var pupMat=basicMat('#000000',{rough:0.05,metal:0.6});
  var lipMat=basicMat(gender==='female'?'#c06060':'#904040',{rough:0.35});
  var clothColor=outfit==='Formal'?'#1a1a2e':outfit==='Warrior'?'#3a3a4a':outfit==='Mystic'?'#2a1a3a':outfit==='Royal'?'#3a2a1a':'#2a2a3e';
  var cMat=basicMat(clothColor,{rough:0.35,metal:0.4});
  var cAccent=basicMat('#57e1a3',{rough:0.25,metal:0.7,emit:0x114422,ei:0.4});
  var bkMat=basicMat('#8b4513',{rough:0.4,metal:0.05});

  var g=AV3D.group;

  // === HELPER: add sculpted mesh ===
  function addMesh(geo,mat,pos,rot){
    var m=new THREE.Mesh(geo,mat);
    if(pos)m.position.set(pos[0],pos[1],pos[2]);
    if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
    m.castShadow=true; m.receiveShadow=true;
    g.add(m);
    return m;
  }

  // ========================================
  // BODY SCULPT (high-res anatomical lathe, smooth curves)
  // ========================================
  (function(){
    var pts=[];
    var segs=48; // up from 18 for smooth curves

    // Smooth interpolation helper (cosine)
    function smooth(t){ return 0.5-0.5*Math.cos(t*Math.PI); }

    // Body key radii — anatomically based
    var hipMaxR   = hipR * 1.02;           // widest at hip
    var waistMinR  = waistR * 0.88;        // narrowest at waist (more defined)
    var chestR     = shoulderR * 0.68;     // chest/ribcage (narrower than shoulders)
    var shoulderR2 = shoulderR * 0.92;    // shoulder
    var neckBaseR  = neckR * 1.05;          // neck base
    var underButtR = hipR * 0.85;          // below glutes

    for(var i=0;i<=segs;i++){
      var t=i/segs;
      var y=hipY+t*torsoLen;
      var r;

      // ---- Smooth body profile using cosine blending ----
      // t=0: hip bottom, t=0.1: hip widest, t=0.35: waist, t=0.6: chest, t=0.85: shoulder, t=1: neck base

      if(t<0.08){
        // Glute/hip bottom — smooth from under-butt to hip max
        r = underButtR + (hipMaxR - underButtR) * smooth(t/0.08);
      } else if(t<0.22){
        // Hip to waist — the critical hip-to-waist transition
        var lt = (t-0.08)/0.14;
        r = hipMaxR + (waistMinR - hipMaxR) * smooth(lt);
      } else if(t<0.45){
        // Waist to chest/ribcage
        var lt = (t-0.22)/0.23;
        r = waistMinR + (chestR - waistMinR) * smooth(lt);
      } else if(t<0.72){
        // Chest to shoulder
        var lt = (t-0.45)/0.27;
        r = chestR + (shoulderR2 - chestR) * smooth(lt);
      } else if(t<0.92){
        // Shoulder to upper neck
        var lt = (t-0.72)/0.20;
        r = shoulderR2 + (neckBaseR - shoulderR2) * smooth(lt);
      } else {
        // Neck base taper
        var lt = (t-0.92)/0.08;
        r = neckBaseR + (neckR*0.8 - neckBaseR) * smooth(lt);
      }

      // Weight factor — smooth fullness
      if(ws>1.0){
        var fullness = (ws-1.0)*0.5;
        // Add more to waist and hips for heavier builds
        r += fullness * (0.6 + 0.4*Math.cos((t-0.35)*Math.PI*1.4));
      }

      pts.push(new THREE.Vector2(Math.max(0.01,r),y));
    }
    var geo=new THREE.LatheGeometry(pts,96); // 96 radial segments for smooth surface
    var p=geo.attributes.position;
    for(var vi=0;vi<p.count;vi++){
      var x=p.getX(vi),y=p.getY(vi),z=p.getZ(vi);
      var angle=Math.atan2(z,x);
      var r=Math.sqrt(x*x+z*z);
      var t=(y-hipY)/torsoLen;

      // ---- Elliptical cross-section (wider side-to-side than front-to-back) ----
      // Front-back depth is ~92% of side width for a natural torso shape
      var depthFactor = 0.92;
      // Adjust by angle: 0=side, PI/2=front, -PI/2=back
      var angleFromSide = Math.abs(angle);
      if(angleFromSide > Math.PI/2) angleFromSide = Math.PI - angleFromSide;
      r *= 1.0 + (depthFactor-1.0) * Math.cos(angleFromSide*2);

      // ---- Anatomical surface details ----

      // Female breast mounds (front, two peaks)
      if(gender==='female'&&t>0.42&&t<0.70){
        var frontness=Math.max(0,Math.cos(angle));
        if(frontness>0.05){
          // Two breast centers offset left/right by ~0.065
          var bx = r*Math.cos(angle); // current x
          var bz = r*Math.sin(angle); // current z (depth)
          var breastX = 0.065;
          var distFromL = Math.sqrt((bx+breastX)*(bx+breastX) + (bz-0.03)*(bz-0.03));
          var distFromR = Math.sqrt((bx-breastX)*(bx-breastX) + (bz-0.03)*(bz-0.03));
          var minDist = Math.min(distFromL, distFromR);
          if(minDist < 0.06){
            var bf = (1 - minDist/0.06) * Math.sin((t-0.42)/0.28*Math.PI);
            r += 0.045 * bf * ws * frontness;
          }
        }
      }

      // Pectoral definition (male)
      if(gender==='male'&&t>0.42&&t<0.68){
        var frontness=Math.max(0,Math.cos(angle));
        if(frontness>0.15){
          r += 0.025 * Math.sin((t-0.42)/0.26*Math.PI) * ms * frontness;
        }
      }

      // Abdominal definition (subtle, front)
      if(t>0.18&&t<0.42&&Math.abs(angle)<0.6){
        var abLine = Math.sin((t-0.18)/0.24*Math.PI*3) * 0.003 * ms;
        var abGroove = Math.cos(angle*4) * 0.002 * ms;
        r += (abLine + abGroove) * Math.max(0, Math.cos(angle));
      }

      // Glute prominence (back, lower torso)
      if(t>-0.05&&t<0.12&&Math.cos(angle)<-0.15){
        var gf = Math.sin((0.12-t)/0.17*Math.PI);
        r += 0.055 * gf * ws * Math.max(0, -Math.cos(angle));
      }

      // Lumbar curve (lower back, concave)
      if(t>0.08&&t<0.35&&Math.cos(angle)<-0.1){
        r -= 0.022 * Math.sin((t-0.08)/0.27*Math.PI) * Math.max(0, -Math.cos(angle));
      }

      // Latissimus dorsi (back, mid, male muscle)
      if(gender==='male'&&t>0.28&&t<0.62&&Math.cos(angle)<-0.2){
        r += 0.018 * ms * Math.sin((t-0.28)/0.34*Math.PI) * Math.max(0, -Math.cos(angle));
      }

      // Collarbone depression (front, top)
      if(t>0.82&&t<0.95&&Math.abs(angle)<0.7){
        r -= 0.012 * Math.sin((t-0.82)/0.13*Math.PI) * Math.max(0, Math.cos(angle));
      }

      // Shoulder cap (sides, top)
      if(t>0.85&&Math.abs(angle)>0.8&&Math.abs(angle)<2.3){
        r += 0.022 * Math.sin((t-0.85)/0.15*Math.PI) * ms;
      }

      // Navel indent (front, ~waist level)
      if(t>0.28&&t<0.34&&Math.abs(angle)<0.18){
        r -= 0.01 * (1 - Math.abs(angle)/0.18);
      }

      // Rib hints (front, subtle shading)
      if(t>0.38&&t<0.52&&Math.abs(angle)<0.5){
        r -= 0.003 * Math.sin((t-0.38)/0.14*Math.PI*3) * Math.max(0, Math.cos(angle));
      }

      // Lower belly softness (front, bottom)
      if(t<0.15&&t>-0.02&&Math.cos(angle)>0.3){
        r += 0.012 * Math.max(0, Math.cos(angle)) * (1 - t/0.15);
      }

      x=r*Math.cos(angle);
      z=r*Math.sin(angle);
      p.setXYZ(vi,x,y,z);
    }
    p.needsUpdate=true;
    geo.computeVertexNormals();
    addMesh(geo,sMat);
  })();

  // ========================================
  // NECK SCULPT===============
  // NECK SCULPT (sculpted cylinder with muscle)
  // ========================================
  (function(){
    var geo=new THREE.CylinderGeometry(Math.max(0.01,neckR*0.75),Math.max(0.01,neckR),0.09,24,8);
    var p=geo.attributes.position;
    for(var vi=0;vi<p.count;vi++){
      var x=p.getX(vi),y=p.getY(vi),z=p.getZ(vi);
      var angle=Math.atan2(z,x);
      var r=Math.sqrt(x*x+z*z);
      var t=(y+0.045)/0.09;
      // Sternocleidomastoid (front-side muscles)
      if(Math.abs(angle)>0.3&&Math.abs(angle)<1.2){
        r+=0.015*Math.sin(t*Math.PI)*Math.sin((Math.abs(angle)-0.3)/0.9*Math.PI)*ms;
      }
      // Back nuchal ridge
      if(Math.abs(angle)>2.0){
        r+=0.008*Math.sin(t*Math.PI);
      }
      x=r*Math.cos(angle);
      z=r*Math.sin(angle);
      p.setXYZ(vi,x,y,z);
    }
    p.needsUpdate=true;
    geo.computeVertexNormals();
    addMesh(geo,sMat,[0,neckY-0.045,0]);
  })();

  // ========================================
  // HEAD SCULPT (high-res sphere, heavily deformed for face)
  // ========================================
  (function(){
    var geo=new THREE.SphereGeometry(Math.max(0.01,hR),96,64);
    var p=geo.attributes.position;
    for(var vi=0;vi<p.count;vi++){
      var x=p.getX(vi),y=p.getY(vi),z=p.getZ(vi);
      var nx=x/hR, ny=y/hR, nz=z/hR;

      // Elongate skull
      y=y*(hL/hR);
      ny=y/hR;

      // Flatten back
      if(nz<0) z=z*0.91;

      // Narrow jaw
      if(ny<-0.1){
        var jf=1-Math.abs(ny+0.1)/0.5*0.25*jawW;
        x*=jf; z*=jf*0.9;
      }

      // Brow ridge
      if(ny>0.08&&ny<0.3&&nz>0.2){
        var bf=Math.sin((ny-0.08)/0.22*Math.PI);
        z+=0.012*bf*Math.max(0,nz);
      }

      // Nose
      var noseYN=-0.05, noseZN=0.85;
      var noseHW=0.035*noseW;
      var noseLen=0.1*noseL;
      if(nz>0.35){
        var dy=ny-noseYN, dx=nx;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<0.18){
          var nf=1-dist/0.18;
          // Bridge
          if(dy>-noseLen&&dy<0.04){
            var bp=(dy+noseLen)/(noseLen+0.04);
            var bw=noseHW*(1-bp*0.3);
            if(Math.abs(dx)<bw){
              z+=(0.015+0.008*bp)*nf*Math.max(0,1-Math.abs(dx)/bw);
            }
          }
          // Tip
          if(dy>-noseLen*0.2&&dy<noseLen*0.15&&Math.abs(dx)<noseHW*0.7){
            z+=0.02*nf*Math.max(0,1-Math.abs(dx)/(noseHW*0.7));
          }
          // Nostril wings
          if(dy<0&&dy>-noseLen*0.5&&Math.abs(dx)>noseHW*0.5&&Math.abs(dx)<noseHW*1.4){
            var wf=1-Math.abs(Math.abs(dx)-noseHW*0.8)/(noseHW*0.6);
            x+=0.008*nf*wf*Math.sign(dx);
            z+=0.005*nf*wf;
          }
          // Alar base
          if(dy<-0.01&&dy>-0.04&&Math.abs(dx)>noseHW*0.3&&Math.abs(dx)<noseHW){
            y-=0.004*nf*Math.max(0,1-Math.abs(Math.abs(dx)-noseHW*0.6)/(noseHW*0.4));
          }
        }
      }

      // Nose shape modifiers
      if(noseShape==='Aquiline'||noseShape==='Roman'||noseShape==='Hooked'){
        if(nz>0.4&&ny>0&&ny<0.1){z+=0.005;} // bridge bump
      }
      if(noseShape==='Button'||noseShape==='Snub'){
        if(nz>0.5&&ny<-0.02&&ny>-0.08){z+=0.008; y+=0.003;} // upturned
      }

      // Cheekbones
      if(ny>-0.1&&ny<0.12&&Math.abs(nx)>0.25&&Math.abs(nx)<0.65&&nz>-0.2){
        var cf=Math.sin((ny+0.1)/0.22*Math.PI);
        x+=0.015*cf*Math.sign(nx);
        z+=0.005*cf*Math.max(0,nz);
      }

      // Eye sockets
      if(nz>0.25&&ny>0.0&&ny<0.18){
        var eL=Math.sqrt(Math.pow(nx+0.32,2)+Math.pow(ny-0.06,2));
        var eR=Math.sqrt(Math.pow(nx-0.32,2)+Math.pow(ny-0.06,2));
        var ed=Math.min(eL,eR);
        if(ed<0.16){
          z-=0.012*(1-ed/0.16);
          if(ed<0.08) y-=0.003*(1-ed/0.08);
        }
      }

      // Chin
      if(ny<-0.25&&nz>0.15){
        var cf=Math.max(0,1-Math.abs(ny+0.35)/0.15);
        z+=0.012*cf*Math.max(0,nz);
        x*=1+0.05*cf;
      }

      // Jaw angle
      if(ny>-0.35&&ny<-0.15&&Math.abs(nx)>0.4){
        var jaf=Math.sin((ny+0.35)/0.2*Math.PI);
        x+=0.01*jaf*Math.sign(nx)*jawW;
      }

      // Temple hollows
      if(ny>0.15&&ny<0.4&&Math.abs(nx)>0.5){
        var tf=Math.sin((ny-0.15)/0.25*Math.PI);
        x-=0.012*tf*Math.sign(nx);
      }

      // Forehead slope
      if(ny>0.3&&nz>0.15){
        z-=0.015*((ny-0.3)/0.4)*Math.max(0,nz);
      }

      // Lip area (slight forward for mouth)
      if(ny>-0.12&&ny<-0.04&&nz>0.5){
        var lf=Math.sin((ny+0.12)/0.08*Math.PI);
        z+=0.005*lf*Math.max(0,nz);
      }

      // Philtrum (groove above lips)
      if(ny>-0.04&&ny<0.0&&Math.abs(nx)<0.05&&nz>0.6){
        z-=0.003*(1-Math.abs(nx)/0.05);
      }

      p.setXYZ(vi,x,y,z);
    }
    p.needsUpdate=true;
    geo.computeVertexNormals();
    addMesh(geo,sMat,[0,headCY,0]);
  })();

  // === EYES (separate meshes for clarity) ===
  var hRZ=hR*0.95;
  var eyeY=headCY+0.01*eyeSize;
  var eyeZ=hRZ-0.005;
  var eyeSpread=0.04*headW;
  var eyeR=0.018*eyeSize;
  for(var es=-1;es<=1;es+=2){
    var ew=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,eyeR*1.15),16,16),eyeWMat);
    ew.position.set(es*eyeSpread,eyeY,eyeZ);
    g.add(ew);
    var iris=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,eyeR*0.65),14,14),irisMat);
    iris.position.set(es*eyeSpread,eyeY,eyeZ+eyeR*0.5);
    g.add(iris);
    var pup=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,eyeR*0.32),10,10),pupMat);
    pup.position.set(es*eyeSpread,eyeY,eyeZ+eyeR*0.75);
    g.add(pup);
    // Eyelid (upper) - thin shell
    var lid=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,eyeR*1.2),16,12,0,Math.PI*2,0,Math.PI*0.35),sDark);
    lid.position.set(es*eyeSpread,eyeY,eyeZ);
    lid.scale.set(1,0.7,1);
    g.add(lid);
    // Lashes (female)
    if(gender==='female'){
      for(var li=0;li<4;li++){
        var la=0.02+li*0.015;
        var lash=new THREE.Mesh(new THREE.CylinderGeometry(0.001,0.0015,0.01,4),hDark);
        lash.position.set(es*eyeSpread+(li-1.5)*0.012,eyeY+eyeR*0.7,eyeZ+eyeR*0.1);
        lash.rotation.z=(li-1.5)*0.1;
        g.add(lash);
      }
    }
  }

  // === EYEBROWS ===
  var browY=headCY+0.038*browPos;
  var browZ=hRZ+0.005;
  for(var bs=-1;bs<=1;bs+=2){
    var brow=new THREE.Mesh(new THREE.BoxGeometry(0.038*headW,0.007,0.012),hMat);
    brow.position.set(bs*0.042*headW,browY,browZ);
    brow.rotation.z=bs*0.08;
    g.add(brow);
  }

  // === LIPS (sculpted torus) ===
  var mouthY=headCY-0.075;
  var mouthW=0.04*lipSz;
  var lipH=0.012*lipSz;
  // Upper lip with cupid's bow
  var ulGeo=new THREE.TorusGeometry(Math.max(0.001,mouthW*0.5),Math.max(0.001,lipH*0.5),8,16,Math.PI);
  var ul=new THREE.Mesh(ulGeo,lipMat);
  ul.position.set(0,mouthY+lipH*0.3,hRZ-0.002);
  ul.rotation.x=Math.PI;
  g.add(ul);
  // Lower lip (fuller)
  var llGeo=new THREE.TorusGeometry(Math.max(0.001,mouthW*0.5),Math.max(0.001,lipH*0.6),8,16,Math.PI);
  var ll=new THREE.Mesh(llGeo,lipMat);
  ll.position.set(0,mouthY-lipH*0.4,hRZ-0.002);
  g.add(ll);
  // Cupid's bow bump
  var cb=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,lipH*0.3),8,8),lipMat);
  cb.position.set(0,mouthY+lipH*0.5,hRZ+0.002);
  cb.scale.set(0.5,1,0.5);
  g.add(cb);

  // === EARS (sculpted) ===
  for(var earS=-1;earS<=1;earS+=2){
    var earGeo=new THREE.SphereGeometry(Math.max(0.001,0.026*headW),16,16);
    var ep=earGeo.attributes.position;
    for(var ei=0;ei<ep.count;ei++){
      var ex=ep.getX(ei),ey=ep.getY(ei),ez=ep.getZ(ei);
      // Flatten ear
      ex*=0.35;
      ey*=0.85;
      // Inner fold
      if(ez>0){ez*=0.5;}
      if(Math.abs(ex)<0.005&&ez>0){ez-=0.003;}
      ep.setXYZ(ei,ex,ey,ez);
    }
    ep.needsUpdate=true;
    earGeo.computeVertexNormals();
    var ear=new THREE.Mesh(earGeo,sDark);
    ear.position.set(earS*hR*0.92,headCY-0.005,0);
    g.add(ear);
    // Ear lobe
    var lobe=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,0.01*headW),8,8),sDark);
    lobe.position.set(earS*hR*0.92,headCY-0.03,0);
    lobe.scale.set(0.5,0.8,0.5);
    g.add(lobe);
  }

  // ========================================
  // ARMS (hands-on-hips pose, sculpted with muscle definition)
  // ========================================

  // Helper: create a cylinder between two points
  function limbBetween(x1,y1,z1, x2,y2,z2, rTop, rBot, segs, heightSegs, mat, deformFn){
    var dx=x2-x1, dy=y2-y1, dz=z2-z1;
    var len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(len<0.001) return null;
    var geo=new THREE.CylinderGeometry(Math.max(0.01,rTop),Math.max(0.01,rBot),len,segs||48,heightSegs||16);
    if(deformFn){
      var p=geo.attributes.position;
      for(var vi=0;vi<p.count;vi++){
        var px=p.getX(vi),py=p.getY(vi),pz=p.getZ(vi);
        deformFn(px,py,pz,p,vi);
      }
      p.needsUpdate=true;
    }
    geo.computeVertexNormals();
    var m=new THREE.Mesh(geo,mat);
    // Position at midpoint
    m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
    // Orient: rotate from Y axis to direction
    var dir=new THREE.Vector3(dx,dy,dz).normalize();
    var up=new THREE.Vector3(0,1,0);
    var quat=new THREE.Quaternion().setFromUnitVectors(up,dir);
    m.quaternion.copy(quat);
    m.castShadow=true; m.receiveShadow=true;
    g.add(m);
    return m;
  }

  for(var side=-1;side<=1;side+=2){
    var ax=side*shoulderR*1.05;

    // Shoulder joint ball — smooths torso-to-arm transition
    addMesh(new THREE.SphereGeometry(Math.max(0.001,armR*1.4),24,24),sMat,[ax*0.92,shoulderY-0.01,0]);

    // Hands-on-hips pose: shoulder -> elbow (outward & down) -> hand (on hip)
    var shoulderX = ax;
    var shoulderYPos = shoulderY;
    var elbowX = ax + side * 0.05;
    var elbowY = shoulderY - upperArmLen * 0.85;
    var handX = side * hipR * 0.65;
    var handY = hipY + torsoLen * 0.08;
    var handZ = 0;

    // Upper arm (shoulder to elbow, angled outward)
    limbBetween(
      shoulderX, shoulderYPos, 0,
      elbowX, elbowY, 0,
      armR*1.1, armR*0.85, 48, 16, sMat,
      function(x,y,z,p,vi){
        var angle=Math.atan2(z,x);
        var r=Math.sqrt(x*x+z*z);
        var t=(y+0.14)/0.28; // approx normalized along arm
        // Bicep (front)
        if(Math.cos(angle)>0&&t>0.2&&t<0.7){
          r+=0.015*ms*Math.sin((t-0.2)/0.5*Math.PI)*Math.max(0,Math.cos(angle));
        }
        // Tricep (back)
        if(Math.cos(angle)<0&&t>0.2&&t<0.7){
          r+=0.01*ms*Math.sin((t-0.2)/0.5*Math.PI)*Math.max(0,-Math.cos(angle));
        }
        // Deltoid cap (top)
        if(t>0.85){
          r+=0.015*ms*(t-0.85)/0.15;
        }
        p.setXYZ(vi, r*Math.cos(angle), y, r*Math.sin(angle));
      }
    );

    // Elbow joint
    addMesh(new THREE.SphereGeometry(Math.max(0.001,armR*0.85),24,24),sDark,[elbowX,elbowY,0]);

    // Forearm (elbow to hand on hip, angled inward)
    limbBetween(
      elbowX, elbowY, 0,
      handX, handY, handZ,
      armR*0.8, armR*0.5, 40, 14, sMat,
      function(x,y,z,p,vi){
        var angle=Math.atan2(z,x);
        var r=Math.sqrt(x*x+z*z);
        var t=(y+0.125)/0.25;
        // Flexor (front)
        if(Math.cos(angle)>0&&t>0.3&&t<0.8){
          r+=0.012*ms*Math.sin((t-0.3)/0.5*Math.PI)*Math.max(0,Math.cos(angle));
        }
        // Brachioradialis (side)
        if(Math.abs(Math.cos(angle))<0.5&&t>0.4&&t<0.8){
          r+=0.008*ms*Math.sin((t-0.4)/0.4*Math.PI);
        }
        p.setXYZ(vi, r*Math.cos(angle), y, r*Math.sin(angle));
      }
    );

    // Wrist
    addMesh(new THREE.SphereGeometry(Math.max(0.001,armR*0.5),20,20),sDark,[handX,handY,handZ]);

    // Hand (simplified, resting on hip)
    (function(){
      var palmGeo=new THREE.SphereGeometry(Math.max(0.01,armR*0.7),16,12);
      palmGeo.scale(0.8, 0.5, 0.4);
      addMesh(palmGeo,sMat,[handX,handY-0.01,0.02]);
      // Fingers (curled slightly, resting on hip)
      for(var fi=0;fi<4;fi++){
        var fOff=(fi-1.5)*0.012;
        var fGeo=new THREE.CylinderGeometry(0.005,0.006,0.025,10,3);
        var fmesh=new THREE.Mesh(fGeo,sMat);
        fmesh.position.set(handX+fOff, handY-0.025, 0.03);
        fmesh.rotation.x = -0.3;
        fmesh.castShadow=true;
        g.add(fmesh);
      }
      // Thumb
      var thumb=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.006,0.02,10,3),sMat);
      thumb.position.set(handX+side*0.015, handY-0.005, 0.04);
      thumb.rotation.z = side*-0.6;
      thumb.castShadow=true;
      g.add(thumb);
    })();
  }

  // ========================================
  // LEGS (sculpted cylinders with muscle definition)
  // ========================================
  for(var side=-1;side<=1;side+=2){
    var lx=side*legSpread;

    // Hip joint ball — smooths torso-to-leg transition
    addMesh(new THREE.SphereGeometry(Math.max(0.001,legR*1.3),24,24),sMat,[lx*0.6,hipY-0.01,0]);

    // Thigh
    (function(){
      var geo=new THREE.CylinderGeometry(Math.max(0.01,legR*1.15),Math.max(0.01,legR*0.75),thighLen,48,16);
      var p=geo.attributes.position;
      for(var vi=0;vi<p.count;vi++){
        var x=p.getX(vi),y=p.getY(vi),z=p.getZ(vi);
        var angle=Math.atan2(z,x);
        var r=Math.sqrt(x*x+z*z);
        var t=(y+thighLen/2)/thighLen;
        // Quad (front)
        if(Math.cos(angle)>0&&t>0.1&&t<0.6){
          r+=0.02*ms*Math.sin((t-0.1)/0.5*Math.PI)*Math.max(0,Math.cos(angle));
        }
        // Hamstring (back)
        if(Math.cos(angle)<0&&t>0.15&&t<0.6){
          r+=0.015*ms*Math.sin((t-0.15)/0.45*Math.PI)*Math.max(0,-Math.cos(angle));
        }
        // Inner thigh
        if(Math.abs(angle)>1.5&&t>0.2&&t<0.7){
          r+=0.008*Math.sin((t-0.2)/0.5*Math.PI);
        }
        // Outer thigh
        if(Math.abs(angle)<0.5&&Math.abs(angle)>0&&t>0.05&&t<0.5){
          r+=0.01*ms*Math.sin((t-0.05)/0.45*Math.PI);
        }
        x=r*Math.cos(angle); z=r*Math.sin(angle);
        p.setXYZ(vi,x,y,z);
      }
      p.needsUpdate=true; geo.computeVertexNormals();
      addMesh(geo,sMat,[lx,hipY-thighLen/2,0]);
    })();

    // Knee
    addMesh(new THREE.SphereGeometry(Math.max(0.001,legR*0.85),24,24),sDark,[lx,hipY-thighLen,0]);
    // Kneecap
    var kc=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,legR*0.35),12,12),sDark);
    kc.position.set(lx,hipY-thighLen,legR*0.5);
    kc.scale.set(1,0.7,0.6);
    g.add(kc);

    // Calf
    (function(){
      var geo=new THREE.CylinderGeometry(Math.max(0.01,legR*0.7),Math.max(0.01,legR*0.4),calfLen,40,14);
      var p=geo.attributes.position;
      for(var vi=0;vi<p.count;vi++){
        var x=p.getX(vi),y=p.getY(vi),z=p.getZ(vi);
        var angle=Math.atan2(z,x);
        var r=Math.sqrt(x*x+z*z);
        var t=(y+calfLen/2)/calfLen;
        // Gastrocnemius (back)
        if(Math.cos(angle)<0&&t>0.2&&t<0.7){
          r+=0.018*ms*Math.sin((t-0.2)/0.5*Math.PI)*Math.max(0,-Math.cos(angle));
        }
        // Soleus (side)
        if(Math.abs(Math.cos(angle))<0.5&&t>0.3&&t<0.7){
          r+=0.008*ms*Math.sin((t-0.3)/0.4*Math.PI);
        }
        // Shin (front, slightly flat)
        if(Math.cos(angle)>0&&t>0.2){
          r-=0.005*Math.max(0,Math.cos(angle));
        }
        x=r*Math.cos(angle); z=r*Math.sin(angle);
        p.setXYZ(vi,x,y,z);
      }
      p.needsUpdate=true; geo.computeVertexNormals();
      addMesh(geo,sMat,[lx,hipY-thighLen-calfLen/2,0]);
    })();

    // Ankle
    addMesh(new THREE.SphereGeometry(Math.max(0.001,legR*0.4),20,20),sDark,[lx,hipY-thighLen-calfLen,0]);
    // Ankle bone
    var ab=new THREE.Mesh(new THREE.SphereGeometry(0.01,8,8),sDark);
    ab.position.set(lx-legR*0.3*side,hipY-thighLen-calfLen+0.005,0.01);
    g.add(ab);

    // Foot (sculpted)
    (function(){
      var footGeo=new THREE.BoxGeometry(0.07,0.035,0.14);
      var fp=footGeo.attributes.position;
      for(var vi=0;vi<fp.count;vi++){
        var x=fp.getX(vi),y=fp.getY(vi),z=fp.getZ(vi);
        // Heel rounding
        if(z<-0.04){x*=0.7; y*=0.7; z*=0.8;}
        // Toe area taper
        if(z>0.04){x*=0.85;}
        // Arch (bottom, middle)
        if(y<-0.01&&Math.abs(z)<0.04){y+=0.008;}
        // Top of foot curve
        if(y>0.01){y*=0.6+0.4*Math.sin((z+0.07)/0.14*Math.PI);}
        fp.setXYZ(vi,x,y,z);
      }
      fp.needsUpdate=true; footGeo.computeVertexNormals();
      var foot=new THREE.Mesh(footGeo,sMat);
      foot.position.set(lx,0.017,0.04);
      foot.castShadow=true;
      g.add(foot);
      // Toes
      var toeData=[[-0.025,0.014],[ -0.01,0.015],[0.005,0.014],[0.018,0.012],[0.028,0.01]];
      for(var ti=0;ti<5;ti++){
        var td=toeData[ti];
        var tr=0.008+0.002*(1-ti/5);
        var toe=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.001,tr),8,8),sMat);
        toe.position.set(lx+td[0],0.02,0.09);
        toe.scale.set(1,0.5,1.5);
        g.add(toe);
      }
    })();
  }

  // ========================================
  // HAIR (data-driven, same as before)
  // ========================================
  function hairPart(type,geoParams,pos,scale,rot){
    var geo;
    switch(type){
      case 'sphere':
        geo=new THREE.SphereGeometry(Math.max(0.01,geoParams.r),geoParams.ws||24,geoParams.hs||16,geoParams.ps||0,geoParams.pl||Math.PI*2,geoParams.ts||0,geoParams.tl||Math.PI);
        break;
      case 'cylinder':
        geo=new THREE.CylinderGeometry(Math.max(0.01,geoParams.rt),Math.max(0.01,geoParams.rb),geoParams.h,geoParams.segs||16);
        break;
      case 'cone':
        geo=new THREE.ConeGeometry(Math.max(0.01,geoParams.r),geoParams.h,geoParams.segs||8);
        break;
      case 'torus':
        geo=new THREE.TorusGeometry(Math.max(0.01,geoParams.r),Math.max(0.01,geoParams.t),8,20);
        break;
      case 'box':
        geo=new THREE.BoxGeometry(geoParams.w,geoParams.h,geoParams.d);
        break;
    }
    var m=new THREE.Mesh(geo,hMat);
    m.position.set(pos[0],pos[1],pos[2]);
    if(scale)m.scale.set(scale[0],scale[1],scale[2]);
    if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
    m.castShadow=true;
    g.add(m);
    return m;
  }

  if(hairStyle!=='Bald'){
    if(hairStyle==='Short'||hairStyle==='Crew'||hairStyle==='Buzz'){
      var hScale=hairStyle==='Buzz'?0.98:hairStyle==='Crew'?1.02:1.06;
      hairPart('sphere',{r:hR*hScale,ws:24,hs:16,tl:Math.PI*0.55},[0,headCY+0.005,0]);
      if(hairStyle!=='Buzz'){
        hairPart('sphere',{r:hR*1.04,ws:12,hs:10},[-hR*0.6,headCY-0.02,0],[0.35,0.5,1]);
        hairPart('sphere',{r:hR*1.04,ws:12,hs:10},[hR*0.6,headCY-0.02,0],[0.35,0.5,1]);
      }
    }
    else if(hairStyle==='Medium'||hairStyle==='Wavy'){
      hairPart('sphere',{r:hR*1.08,ws:28,hs:20,tl:Math.PI*0.62},[0,headCY+0.008,0],[1,1.1,1]);
      hairPart('sphere',{r:hR*1.05,ws:16,hs:12},[-hR*0.7,headCY-0.06,0],[0.32,0.7,1]);
      hairPart('sphere',{r:hR*1.05,ws:16,hs:12},[hR*0.7,headCY-0.06,0],[0.32,0.7,1]);
      hairPart('cylinder',{rt:hR*0.85,rb:hR*0.7,h:0.18,segs:16},[0,headCY-0.08,-0.04]);
      if(hairStyle==='Wavy'){

      hairPart('sphere',{r:hR*1.03,ws:12,hs:10},[-hR*0.6,headCY-0.02,0],[0.3,0.4,0.9]);
      hairPart('sphere',{r:hR*1.03,ws:12,hs:10},[hR*0.6,headCY-0.02,0],[0.3,0.4,0.9]);
      hairPart('sphere',{r:0.05,ws:16,hs:16},[0,headCY+hR*0.9,-0.02]);

      hairPart('sphere',{r:hR*1.02,ws:12,hs:10},[hR*0.55,headCY-0.01,0],[0.25,0.4,0.8]);
      hairPart('sphere',{r:0.035,ws:12,hs:12},[0,headCY+hR*1.0,0.02]);
      hairPart('torus',{r:0.035,t:0.008},[0,headCY+hR*1.0,0.02],[1,1,1],[Math.PI/2,0,0]);
    }
  }

  // ========================================
  // CLOTHING
  // ========================================
  if(gender==='female'){
    // Bikini top
    for(var cs=-1;cs<=1;cs+=2){
      var cupGeo=new THREE.SphereGeometry(0.06,16,12);
      var cp=cupGeo.attributes.position;

    }

    band.position.set(0,shoulderY-0.04,0);
    band.rotation.x=Math.PI/2;
    g.add(band);
    // Straps
    for(var ss=-1;ss<=1;ss+=2){
      var strap=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.12,6),bkMat);

    }
    // Bikini bottom
    var bkBot=new THREE.Mesh(new THREE.BoxGeometry(hipR*0.7,0.08,0.1),bkMat);

    g.add(bkBot);
    for(var ss=-1;ss<=1;ss+=2){

  } else {
    // Chest wrap
    var cwGeo=new THREE.SphereGeometry(Math.max(0.01,shoulderR*0.9),20,16,0,Math.PI*2,0,Math.PI*0.55);

  // === WINGS ===
  if(wingStyle&&wingStyle!=='None'&&wingSize>0){
    var wMat=av3dMat(wingColor,{rough:0.3,metal:0.1,emit:wingColor,ei:0.1});

    function buildWing(side){
      var wg=new THREE.Group();

          featherGeo.rotation.z=angle*dir;
          featherGeo.rotation.y=dir*wsp*0.5;
          featherGeo.castShadow=true;
          wg.add(featherGeo);

          // Feather tips - flattened ovals
          for(var f=0;f<4;f++){
            var ff=f/3;
            var tip=new THREE.Mesh(
              new THREE.SphereGeometry(Math.max(0.01,0.03*ws*(1-lf*0.3)),8,6),
              l<2?wMat:wDark
            );
            tip.scale.set(1.5,0.3,0.5);
            tip.position.set(
              dir*(len*0.2+ff*len*0.6)*wsp,
              backY+yOff-lf*0.05+Math.sin(angle+ff*0.3)*0.05,
              backZ-lf*0.02-ff*0.02
            );
            tip.rotation.z=angle*dir+ff*0.2;
            tip.castShadow=true;
            wg.add(tip);
          }
        }
        // Central wing bone
        var bone=new THREE.Mesh(
          new THREE.CylinderGeometry(Math.max(0.005,0.008*ws),Math.max(0.004,0.005*ws),0.4*ws,6),
          wDark
        );
        bone.position.set(dir*0.05,backY+0.02,backZ);
        bone.rotation.z=-0.4*dir;
        bone.castShadow=true;
        wg.add(bone);
      }
      else if(wingStyle==='Bat'){
        // Bat/demon wings - membrane between finger bones
        var segments=4;
        for(var s=0;s<segments;s++){
          var sf=s/(segments-1);
          var segLen=0.3*ws*(1-sf*0.5);
          var angle=-0.2-sf*0.5;
          // Finger bone
          var bone=new THREE.Mesh(
            new THREE.CylinderGeometry(Math.max(0.004,0.006*ws),Math.max(0.003,0.004*ws),segLen,5),
            wDark
          );
          bone.position.set(
            dir*(0.05+segLen*0.4*Math.sin(sf*1.2))*wsp,
            backY+0.02-sf*0.08,
            backZ-0.02
          );
          bone.rotation.z=angle*dir;
          bone.castShadow=true;
          wg.add(bone);

          // Membrane between fingers
          if(s<segments-1){
            var nextLen=0.3*ws*(1-(s+1)/(segments-1)*0.5);
            var nextAngle=-0.2-(s+1)/(segments-1)*0.5;
            var midLen=(segLen+nextLen)*0.5;
            var midAngle=(angle+nextAngle)*0.5;
            var membrane=new THREE.Mesh(
              new THREE.CylinderGeometry(Math.max(0.003,0.003*ws),Math.max(0.001,0.001*ws),midLen,3),
              wGlow
            );
            membrane.scale.set(1,1,2.5);
            membrane.position.set(
              dir*(0.05+midLen*0.4*Math.sin((s+0.5)/(segments-1)*1.2))*wsp,
              backY+0.02-(s+0.5)/(segments-1)*0.08,
              backZ-0.03
            );
            membrane.rotation.z=midAngle*dir;
            wg.add(membrane);
          }
        }
        // Wing arm
        var arm=new THREE.Mesh(
          new THREE.CylinderGeometry(Math.max(0.006,0.01*ws),Math.max(0.005,0.007*ws),0.25*ws,6),

        );
        arm.position.set(dir*0.03,backY+0.04,backZ);
        arm.rotation.z=-0.5*dir;
        arm.castShadow=true;
        wg.add(arm);
      }
      else if(wingStyle==='Fairy'||wingStyle==='Butterfly'){
        // Fairy/butterfly wings - translucent veined wings
        var wingShape='Butterfly'===wingStyle;
        for(var p=0;p<(wingShape?2:3);p++){
          var pf=p/(wingShape?1:2);
          var wlen=0.25*ws*(wingShape?(p===0?1:0.7):1-pf*0.3);
          var wwid=0.2*ws*(wingShape?(p===0?0.9:0.6):0.8-pf*0.2);
          var wingGeo=new THREE.Mesh(
            new THREE.SphereGeometry(Math.max(0.02,0.04*ws),12,8),
            wGlow
          );
          wingGeo.scale.set(wid*3,wlen*3,0.15);
          wingGeo.position.set(
            dir*(0.08+wlen*0.5)*wsp,
            backY+0.02-(p*0.12)+(wingShape?(p===0?0.02:-0.08):0),
            backZ-0.03
          );
          wingGeo.rotation.z=-0.3*dir+pf*0.3;
          wingGeo.rotation.y=dir*0.4;
          wingGeo.castShadow=true;
          wg.add(wingGeo);
        }
        // Sparkle particles
        for(var sp=0;sp<6;sp++){
          var sparkle=new THREE.Mesh(
            new THREE.SphereGeometry(Math.max(0.002,0.005*ws),4,4),
            wGlow
          );
          sparkle.position.set(
            dir*(0.1+Math.random()*0.25)*wsp,
            backY+0.02+Math.random()*0.2-0.1,
            backZ-0.05+Math.random()*0.05
          );
          wg.add(sparkle);
        }
      }
      else if(wingStyle==='Fire'||wingStyle==='Energy'){
        // Fire/energy wings - flowing upward shapes
        var flames=7;
        for(var fl=0;fl<flames;fl++){
          var flf=fl/(flames-1);
          var flH=0.3*ws*(1-flf*0.4+Math.random()*0.2);

            backZ-0.02-flf*0.03

          flame.rotation.z=(0.15+flf*0.3)*dir;
          flame.castShadow=true;
          wg.add(flame);

          // Inner flame
          var inner=new THREE.Mesh(
            new THREE.ConeGeometry(Math.max(0.005,flR*0.5),flH*0.7,4),
            av3dMat(wingStyle==='Fire'?'#ff8800':wingColor,{rough:0.1,emit:wingStyle==='Fire'?'#ff4400':wingColor,ei:0.6})
          );
          inner.position.copy(flame.position);
          inner.position.y+=0.02;
          inner.rotation.copy(flame.rotation);
          wg.add(inner);
        }
      }
      else if(wingStyle==='Dragon'){
        // Dragon wings - wide membrane with finger bones
        var dSegs=5;
        for(var ds=0;ds<dSegs;ds++){
          var dsf=ds/(dSegs-1);
          var dLen=0.4*ws*(1-dsf*0.4);

          // Finger
          var fBone=new THREE.Mesh(
            new THREE.CylinderGeometry(Math.max(0.005,0.008*ws),Math.max(0.004,0.005*ws),dLen,5),
            wDark

          fBone.position.set(
            dir*(0.06+dLen*0.45*Math.sin(dsf*1.4))*wsp,
            backY+0.03-dsf*0.1,
            backZ-0.02
          );
          fBone.rotation.z=dAngle*dir;
          fBone.castShadow=true;
          wg.add(fBone);

          // Membrane
          if(ds<dSegs-1){
            var dNextLen=0.4*ws*(1-(ds+1)/(dSegs-1)*0.4);
            var dMidLen=(dLen+dNextLen)*0.5;
            var dMidAngle=(dAngle+(-0.1-(ds+1)/(dSegs-1)*0.45))*0.5;
            var dMem=new THREE.Mesh(
              new THREE.SphereGeometry(Math.max(0.02,0.04*ws),8,6),
              wGlow
            );
            dMem.scale.set(0.1,dMidLen*1.5,0.15);
            dMem.position.set(
              dir*(0.06+dMidLen*0.4*Math.sin((ds+0.5)/1.4))*wsp,
              backY+0.03-(ds+0.5)/(dSegs-1)*0.1,
              backZ-0.04
            );
            dMem.rotation.z=dMidAngle*dir;
            wg.add(dMem);
          }
        }
        // Claw at top
        var claw=new THREE.Mesh(
          new THREE.ConeGeometry(Math.max(0.008,0.012*ws),0.03*ws,5),
          wDark
        );
        claw.position.set(dir*0.06,backY+0.1,backZ);
        claw.rotation.z=-0.5*dir;
        wg.add(claw);
      }

      return wg;
    }

    // Add both wings
    var leftWing=buildWing(-1);
    var rightWing=buildWing(1);
    g.add(leftWing);
    g.add(rightWing);
  }

  g.position.y=0;
  AV3D.camera.lookAt(0,headCY*0.5,0);
}
function av3dAnimate(){
  if(!AV3D.initDone||!AV3D.renderer)return;
  AV3D.animId=requestAnimationFrame(av3dAnimate);
  if(AV3D.group){
    AV3D.group.rotation.y=AV3D.rotY;
    AV3D.group.rotation.x=AV3D.rotX;
  }
  AV3D.renderer.render(AV3D.scene,AV3D.camera);
}

function av3dDestroy(){
  if(AV3D.animId)cancelAnimationFrame(AV3D.animId);
  AV3D.animId=null;
  AV3D.initDone=false;
  if(AV3D.renderer){AV3D.renderer.dispose();AV3D.renderer=null;}
  if(AV3D.canvas&&AV3D.canvas.parentNode)AV3D.canvas.parentNode.removeChild(AV3D.canvas);
  AV3D.canvas=null;
  AV3D.scene=null;
  AV3D.group=null;
  AV3D.rotY=0;AV3D.rotX=0;AV3D.zoom=3.2;
}

function av3dSnapshot(){
  if(!AV3D.initDone||!AV3D.renderer)return null;
  AV3D.renderer.render(AV3D.scene,AV3D.camera);
  return AV3D.renderer.domElement.toDataURL('image/png');
}

function snapshotAvatar(){
  if(!AV3D.initDone||!AV3D.renderer)return;
  AV3D.renderer.render(AV3D.scene,AV3D.camera);
  var dataUrl=AV3D.renderer.domElement.toDataURL('image/png');
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download='living_cycle_avatar.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportGLB(){
  if(!AV3D.initDone||!AV3D.group)return;
  if(typeof THREE.GLTFExporter==='undefined'){alert('GLTFExporter not loaded. Please refresh the page.');return;}
  var exporter=new THREE.GLTFExporter();
  exporter.parse(AV3D.group,function(result){
  var blob=new Blob([result],{type:'model/gltf-binary'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='living_cycle_avatar.glb';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  },{binary:true});
}
